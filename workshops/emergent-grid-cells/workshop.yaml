schema: workshop/v1
id: emergent-grid-cells
constellation: minds-life

title:
  en: "Grid Cells From a Network That Was Never Asked"
  ar: "خلايا الشبكة: نمطٌ سداسي لم يطلبه أحد"

concept:
  en: "A representation nobody asked for is still an answer to a question somebody asked"
  ar: "تمثيلٌ لم يطلبه أحد، لكنه جوابٌ عن سؤالٍ طرحناه نحن"
scenario:
  en: >-
    A rat in the dark still knows where it is. It feels its own speed and
    turning and keeps a running sum: path integration. In 2005, recordings from
    the rat's entorhinal cortex found neurons that fire at the corners of a
    triangular lattice laid across the whole room. They were named grid cells,
    and nothing in the rat's world is hexagonal. Here you hand a small recurrent
    network the same problem: velocity in, "where am I?" out. Hexagons are never
    mentioned. Then you open the network and draw where each hidden unit fires.
    You also train a twin that differs in one detail only, to find out what the
    hexagons were really a response to.
  ar: >-
    فأرٌ في الظلام ما زال يعرف أين هو. يشعر بسرعته وبانعطافاته، ويجمعها أولاً بأول، وهذا ما نسميه تكامل المسار. في عام 2005 سجّل الباحثون نشاط الخلايا في القشرة الشمية الداخلية للفأر، فوجدوا خلايا تنشط عند رؤوس نمطٍ مثلثي يمتد على أرض الغرفة كلها. سُمّيت هذه الخلايا خلايا الشبكة، مع أنه لا شيء في عالم الفأر سداسي الشكل. في هذه الورشة تعطي شبكةً تكرارية صغيرة المسألة نفسها: تدخلها السرعة، ويخرج منها جواب «أين أنا؟». ولا ذكر للسداسيات في أي مكان. ثم تفتح النموذج وترسم أين تنشط كل وحدة مخفية فيه. وتدرّب إلى جانبه توأماً لا يختلف عنه إلا في تفصيل واحد، لتعرف ما الذي استدعى السداسيات فعلاً.

goal:
  en: >-
    Both networks learn to track their own position from velocity alone, and the centre-surround network does it less precisely. Its grid scores still sit above its Gaussian twin's as a whole, and in this seed a clear share of its units become stable hexagonal maps. Across seven seeds that share ranged from 1% to 22%: the lean toward a lattice held, and the lattice itself did not.
  ar: >-
    تتعلم الشبكتان كلتاهما تتبّع موقعهما من السرعة وحدها، لكن شبكة المركز والمحيط تفعل ذلك بدقة أقل. ومع هذا تبقى درجات السداسية لديها، في مجملها، أعلى من درجات توأمها الغاوسي. وفي البذرة العشوائية المستخدمة هنا تتحول حصةٌ واضحة من وحداتها إلى خرائط سداسية مستقرة. وعبر سبع بذور تراوحت هذه الحصة بين 1% و22%: الميل نحو النمط ثبت عبرها كلها، أما النمط نفسه فلم يثبت.

difficulty: intermediate
status: stable
publishedAt: "2026-09-17"

maintenance:
  tier: stable
  cadence: yearly

estimate:
  gpuMinutes: 43      # final T4 runs: 41.2 (en) and 43.7 (ar) min of training at 22-25 steps/s
  totalMinutes: 55    # those runs took 42 and 45 min end to end, plus reading time

papers:
  - slug: recurrent-neural-network
    role: core
    label:
      en: "a hidden state that carries the position forward from step to step"
      ar: "حالة مخفية تحمل الموقع من كل خطوة إلى التي تليها"
  - slug: backpropagation-through-time
    role: core
    label:
      en: "how an error at the last step reaches the weights used at the first"
      ar: >-
        كيف يصل خطأ الخطوة الأخيرة إلى الأوزان التي استُخدمت في الخطوة الأولى
  - slug: long-short-term-memory
    role: supporting
    label:
      en: "the gated alternative this workshop deliberately does not use"
      ar: "البديل ذو البوابات الذي تتجنبه هذه الورشة عن قصد"
  - slug: neural-turing-machine
    role: supporting
    label:
      en: "a contrast: memory with an address, against memory that is only a state"
      ar: "للمقارنة: ذاكرة لها عنوان، في مقابل ذاكرة ليست سوى حالة"

assets: []

profiles:
  - id: free
    default: true
    name:
      en: "Free tier (T4)"
      ar: "المستوى المجاني"
    requires:
      gpu: true
      vramGb: 2         # measured peak 0.70 GB (fp16)
      ramGb: 4
    scale:
      seed: 17
      box_m: 2.2
      place_cells: 512
      place_sigma_m: 0.12
      surround_scale: 2
      hidden_units: 4096
      seq_len: 20
      batch: 200
      train_steps: 30000   # T4: centre-surround leaves its plateau near 11k and reaches 9.4 cm at 30k; 15k left it at 64-82 cm
      learning_rate: 0.0001
      weight_decay: 0.0001
      log_every: 2000
      map_res: 20
      eval_batches: 25
      grid_score_cut: 0.3
      stability_min: 0.5
      ring_max: 0.7
      units_shown: 25
  - id: smoke
    name:
      en: "Wiring test (CPU, no result)"
      ar: "اختبار التوصيل على المعالج المركزي، دون نتيجة علمية"
    requires:
      gpu: false
      vramGb: 0
      ramGb: 2
    scale:
      seed: 17
      box_m: 2.2
      place_cells: 128
      place_sigma_m: 0.12
      surround_scale: 2
      hidden_units: 128
      seq_len: 20
      batch: 32
      train_steps: 60
      learning_rate: 0.0001
      weight_decay: 0.0001
      log_every: 20
      map_res: 20
      eval_batches: 2
      grid_score_cut: 0.3
      stability_min: 0.5
      ring_max: 0.7
      units_shown: 9

checks:
  # Design after the pre-registered seed sweep (tools/sweep_emergent_grid_cells.py, T4, torch 2.11):
  #   stable grid units across 7 seeds: 1.0 3.5 4.1 11.7 12.8 16.6 22.4% -> 4 of 7 at >= 8% -> option 3.
  #   all 7 left the plateau (error 6.4-9.4 cm); untrained floor 1.4-2.2%.
  #   median gap, centre-surround minus twin: +0.151 (seed 3), +0.185 (seed 97), the two weakest seeds.
  #   the twin navigated more precisely in 4 of 4 seeds where both were trained.
  #   seeds 17, 3 and 97 each reproduced exactly across separate T4 sessions.
  # both-integrate min 0.35: lowest measured skill 0.484. surround-pull min 0.08: about half the
  # smallest gap measured. Code.py takes those medians over STABLE units (over all active units,
  # untrained weights alone give ~0.14); the sweep measured them over active units, where stable
  # units were 99% of centre-surround and 81-93% of twin units. Final free run (seed 17, both
  # languages, identical metrics): stable-unit gap 0.463, skill 0.484/0.771, grid units 16.6%.
  # grid-units is reported, not required: it varies twentyfold by seed.
  - id: both-integrate
    required: true
    min: 0.35
    label:
      en: "Path-integration skill of the weaker of the two networks"
      ar: "مهارة تكامل المسار لدى الأضعف بين الشبكتين"
  - id: surround-pull
    required: true
    min: 0.08
    label:
      en: "Median grid score of the centre-surround network minus its Gaussian twin's"
      ar: "وسيط درجات شبكة المركز والمحيط مطروحاً منه وسيط درجات توأمها الغاوسي"
  - id: grid-units
    required: false
    min: 8
    label:
      en: "Percent of centre-surround units that are grid units: above the score cut and stable across halves of the data"
      ar: >-
        نسبة وحدات شبكة المركز والمحيط التي تُعدّ وحدات سداسية: تتجاوز عتبة الدرجة وتبقى خريطتها ثابتة بين نصفي البيانات
hints:
  - en: >-
      Two things can fail independently on longer walks: the readout that turns hidden activity into a position, and the firing maps themselves. Compare how much the error grows, in centimetres, with how much the scores of the same units fall.
    ar: >-
      على المسارات الأطول قد يفشل شيئان، كلٌّ منهما مستقل عن الآخر: طبقة القراءة التي تحوّل النشاط المخفي إلى موقع، وخرائط النشاط نفسها. قارن بين أمرين: بكم سنتيمتراً يزيد الخطأ، وبكم تنخفض درجات الوحدات نفسها.
  - en: >-
      Put the error beyond the horizon next to the error of always guessing the box centre. The closer it gets to that number, the less the estimate is worth over a plain guess. If the maps stay sharp while that happens, look at whether the bumps are still where they were, or have slid.
    ar: >-
      ضع خطأ الموضع بعد الأفق بجانب خطأ من يخمّن مركز الصندوق دائماً. كلما اقترب الأول من الثاني، قلّ ما يتفوق به تقدير الشبكة على التخمين المجرد. فإن بقيت الخرائط حادة في الوقت نفسه، فانظر: هل بقيت البقع في أماكنها، أم انزلقت؟

terms:
  "Recurrent Neural Network (RNN)":
    en: "A network that reads a sequence one step at a time, feeding its own previous state back in."
    ar: >-
      شبكة تقرأ السلسلة خطوةً بعد خطوة، وتعيد إدخال حالتها السابقة في كل مرة.
  "Hidden State":
    en: "The vector a recurrent network carries between steps; here, the only place the position can live."
    ar: >-
      المتجه الذي تحمله الشبكة التكرارية من خطوة إلى أخرى، وهو هنا المكان الوحيد الذي يمكن أن يُحفظ فيه الموقع.
  "Path Integration":
    en: "Estimating where you are by adding up your own movements from a known starting point."
    ar: "تقدير موقعك بجمع حركاتك أنت، انطلاقاً من نقطة بداية معروفة."
  "Spatial Representation":
    en: "A pattern of activity that varies systematically with location."
    ar: "نمط نشاط يتغير بانتظام كلما تغير المكان."
  "Emergent Behavior":
    en: "Behaviour that arises from training or interaction without being specified directly."
    ar: "سلوك ينشأ من التدريب أو التفاعل دون أن يحدده أحد مباشرة."
  "Emergent Representation":
    en: "Internal structure a model develops on its own because it helps with the task it was given."
    ar: >-
      بنية داخلية يطوّرها النموذج من تلقاء نفسه لأنها تساعده في المهمة المطلوبة منه.
  "Representation Learning":
    en: "Learning useful internal features as a by-product of optimising a task."
    ar: >-
      تعلّم سمات داخلية مفيدة كأثرٍ جانبي لتحسين الأداء في مهمة ما.
  "Latent Space":
    en: "The space of a model's internal activity, as opposed to its inputs and outputs."
    ar: "فضاء النشاط الداخلي للنموذج، في مقابل مدخلاته ومخرجاته."
  "Neuron":
    en: "One unit of a network: a weighted sum followed by a nonlinearity. Here also a hidden unit whose map is drawn."
    ar: >-
      وحدة واحدة في الشبكة: مجموع موزون يليه تحويل غير خطي. وهي هنا أيضاً الوحدة المخفية التي نرسم خريطتها.
  "Feature Map":
    en: "The activity of one unit laid out over an input dimension — here, over the floor of the arena."
    ar: >-
      نشاط وحدة واحدة مبسوطاً على أحد أبعاد المدخل، وهو هنا أرض الساحة.
  "Generalization":
    en: "Doing the task under conditions not seen in training, such as walks longer than any trained on."
    ar: >-
      أداء المهمة في ظروف لم تظهر أثناء التدريب، كمسارات أطول من أي مسار تدربت عليه الشبكة.
  "Environment":
    en: "The world the agent moves through; here, a square box with walls."
    ar: >-
      العالم الذي يتحرك فيه الوكيل، وهو هنا صندوق مربع تحيط به الجدران.
  "Observation Space":
    en: "What the model receives at each step; here, only a two-dimensional velocity."
    ar: >-
      ما يتلقاه النموذج في كل خطوة، وهو هنا سرعة ثنائية البعد لا أكثر.
  "Trajectory":
    en: "The sequence of positions an agent passes through."
    ar: "تسلسل المواقع التي يمر بها الوكيل."
  "Backpropagation Through Time":
    en: "Training a recurrent network by unrolling it over the sequence and backpropagating through every step."
    ar: >-
      تدريب الشبكة التكرارية بفردها على طول السلسلة، كأنها شبكة عميقة بطبقة لكل خطوة، ثم تمرير الانتشار العكسي عبر الخطوات كلها.

body:
  - type: prose
    title: {en: "Pose the rat's problem", ar: "اطرح مسألة الفأر"}
    phase: orient
    text:
      en: >-
        Close your eyes and walk three steps forward, turn left, walk two more.
        You still have a fair idea where the door is. Nothing told you; you
        integrated your own motion. Animals do this constantly, and in the
        entorhinal cortex of the rat some of the neurons involved have a
        startling signature: plotted against position, each one fires at the
        vertices of a triangular lattice that tiles the entire floor.


        This workshop asks whether an artificial network, given only the same
        problem, arrives at the same answer — and then asks the harder question
        of what exactly made it do so.
      ar: >-
        أغمض عينيك، وامشِ ثلاث خطوات إلى الأمام، ثم انعطف يساراً وامشِ خطوتين. ستظل تعرف تقريباً أين الباب. لم يخبرك أحد؛ أنت جمعت حركتك بنفسك، وهذا هو <Term en="Path Integration">تكامل المسار</Term>. الحيوانات تفعل هذا طوال الوقت. وفي القشرة الشمية الداخلية للفأر، تحمل بعض الخلايا المشاركة في هذه العملية بصمةً مدهشة. ارسم نشاط الواحدة منها على أرض الغرفة، تجدها تنشط عند رؤوس نمطٍ مثلثي يغطي الأرض كلها. وحول كل رأس في هذا النمط ستة رؤوس مجاورة، ولهذا نصفه بأنه سداسي، ونسمّي هذه الخلايا <Term en="Grid Cell">خلايا الشبكة</Term>.


        تسأل هذه الورشة أولاً: إذا أعطينا شبكةً اصطناعية المسألة نفسها ولا شيء غيرها، هل تصل إلى الجواب نفسه؟ ثم تسأل السؤال الأصعب: ما الذي دفعها إليه بالضبط؟

  - type: cell
    id: setup
    ref: setup
    title: {en: "Start the environment", ar: "شغّل البيئة"}
    phase: orient
    caption:
      en: "Confirm the profile and the code hash; everything below is sized from that profile."
      ar: >-
        تأكد من ملف التشغيل المختار ومن بصمة الشيفرة؛ فكل ما يلي يأخذ أحجامه من هذا الملف.

  - type: prose
    title: {en: "Choose what to predict", ar: "اختر ما تتنبأ به"}
    phase: build
    text:
      en: >-
        The network's output is not a pair of coordinates. It predicts the
        activity of {{scale.place_cells}} simulated place cells scattered over a
        {{scale.box_m}}-metre box, each most active near its own centre. The
        workshop trains two versions that differ in the shape of that tuning. In
        one, each place cell is a plain Gaussian bump. In the other, the bump is
        ringed by a shallow zone of suppression — a centre-surround profile.
        Walks, starting weights, network and training schedule are identical.
        Hold on to that single difference; the rest of the workshop turns on it.
      ar: >-
        مخرج الشبكة ليس زوجاً من الإحداثيات. إنها تتنبأ بنشاط {{scale.place_cells}} <Term en="Place Cell">خلية مكان</Term> محاكاة، موزعة داخل صندوق طول ضلعه {{scale.box_m}} متر، وكل خلية تبلغ ذروة نشاطها قرب مركزها. ندرّب نسختين لا تختلفان إلا في شكل هذه الاستجابة. في الأولى، استجابة خلية المكان قمةٌ غاوسية بسيطة. وفي الثانية، تحيط بالقمة حلقةٌ ضحلة من الكبح، وهذا ما نسميه شكل «المركز والمحيط». نحصل عليه بأن نطرح من القمة قمةً غاوسية أعرض منها، أي أنه <Term en="Difference of Gaussians">فرقٌ بين دالتين غاوسيتين</Term>. المسارات والأوزان الابتدائية وبنية الشبكة وجدول التدريب كلها متطابقة. تمسّك بهذا الاختلاف الوحيد، فبقية الورشة تدور حوله.

  - type: cell
    id: arena
    ref: arena
    title: {en: "Draw walks and tuning", ar: "ارسم المسارات والاستجابات"}
    phase: build
    caption:
      en: >-
        Left: six simulated walks over grey place-cell centres; when a walk reaches a wall it slows and slides along it. Right: one place cell's activity along a line through its centre, orange for centre-surround and blue for Gaussian. The orange curve never goes negative. It sits on a raised floor and is notched down to zero in a ring around the peak, and that ring is the surround. Because the code must stay non-negative and sum to one, about three quarters of the centre-surround code is that nearly flat floor, which is why this network's loss will barely move.
      ar: >-
        في اللوحة اليسرى ستة مسارات محاكاة فوق مراكز خلايا المكان (النقاط الرمادية)؛ وحين يبلغ المسار جداراً يبطئ وينزلق بمحاذاته. وفي اللوحة اليمنى نشاط خلية مكان واحدة على خط يمر بمركزها: البرتقالي لشكل المركز والمحيط، والأزرق للشكل الغاوسي. المنحنى البرتقالي لا ينزل تحت الصفر أبداً، بل يستقر على أرضية مرتفعة، ثم ينخفض إلى الصفر في حلقة حول القمة، وهذه الحلقة هي المحيط. فالشيفرة يجب أن تبقى غير سالبة وأن يكون مجموعها واحداً، ولهذا تشغل الأرضية شبه المسطحة نحو ثلاثة أرباعها. وهذه الأرضية تكاد تكون واحدة أينما كان الموقع، فلا تحمل معلومة عن المكان. لذلك لن تتحرك خسارة هذه الشبكة إلا قليلاً، حتى وهي تتعلم.

  - type: prose
    title: {en: "Give it only velocity", ar: "لا تعطها إلا السرعة"}
    phase: build
    text:
      en: >-
        The hidden state starts from the place-cell code of the starting point.
        From then on the network receives one thing per step: how far it moved
        in x and y. To predict the place code {{scale.seq_len}} steps on, it must
        accumulate those movements inside its hidden state. The loss compares
        predicted and true place-cell activity. It contains no term about
        spatial structure, periodicity, or angles.
      ar: >-
        تبدأ <Term en="Hidden State">الحالة المخفية</Term> من شيفرة خلايا المكان عند نقطة الانطلاق. بعدها لا تتلقى الشبكة في كل خطوة إلا شيئاً واحداً: كم تحركت على كل محور. ولكي تتنبأ بشيفرة المكان بعد {{scale.seq_len}} خطوة، لا مفر من أن تراكم تلك الحركات داخل حالتها المخفية. أما دالة الخسارة فتقارن نشاط خلايا المكان المتوقَّع بالنشاط الحقيقي، ولا شيء غير ذلك. ليس فيها أي حدٍّ يخص البنية المكانية أو الدورية أو الزوايا. فإن ظهرت بنيةٌ من هذا النوع لاحقاً، فلن تكون لأننا طلبناها صراحةً.

  - type: cell
    id: model
    ref: model
    title: {en: "Build the path integrator", ar: "ابنِ مُكامِل المسار"}
    phase: build
    caption:
      en: "An encoder for the starting place, a ReLU recurrent layer, and a linear readout — nothing more."
      ar: >-
        مُرمِّز لمكان الانطلاق، وطبقة تكرارية بتفعيل <bdi dir="ltr">ReLU</bdi>، وطبقة قراءة خطية في النهاية. لا شيء غير ذلك.

  - type: scaleNote
    title: {en: "Know the free-tier scale", ar: "اعرف حجم المستوى المجاني"}
    phase: train
    text:
      en: >-
        Each network has {{scale.hidden_units}} hidden units and trains for
        {{scale.train_steps}} steps on batches of {{scale.batch}} walks of
        {{scale.seq_len}} steps. Training the two networks is the long part of
        this workshop, and the comparison needs both. Published models of this
        kind train considerably longer; expect fainter lattices than in the
        literature, not different ones.
      ar: >-
        لكل شبكة {{scale.hidden_units}} وحدة مخفية، وتتدرب {{scale.train_steps}} خطوة على دفعات من {{scale.batch}} مسار، طول كل منها {{scale.seq_len}} خطوة. تدريب الشبكتين هو الجزء الأطول في هذه الورشة، والمقارنة تحتاج إليهما معاً. النماذج المنشورة من هذا النوع تتدرب مدة أطول بكثير، فتوقّع أنماطاً سداسية أبهت مما في الأبحاث، لا أنماطاً مختلفة عنها.

  - type: cell
    id: train_dog
    ref: train_dog
    title: {en: "Train the centre-surround network", ar: "درّب شبكة المركز والمحيط"}
    phase: train
    captures: [train_minutes_dog, peak_vram_gb, dog_final_error_cm, plateau_break_step]
    caption:
      en: >-
        Watch the position error decoded from the predicted place cells, not the loss, which barely moves. Expect a long plateau near a metre. In the reference run the error first fell below half a metre at step {{run.metrics.plateau_break_step}} and ended at {{run.metrics.dog_final_error_cm}} cm. Every one of seven seeds tested broke through, the measured ones between fourteen and twenty thousand steps. Do not stop the cell while the error is flat: position error is the whole of what the network is rewarded for, and the break comes late.
      ar: >-
        راقب خطأ الموضع الذي نستخرجه من تنبؤات خلايا المكان، لا الخسارة التي لا تكاد تتحرك. وتوقّع <Term en="Plateau Phenomenon">فترة ركود</Term> طويلة يبقى فيها الخطأ قرب المتر. في التشغيل المرجعي نزل الخطأ تحت نصف متر أول مرة عند الخطوة {{run.metrics.plateau_break_step}}، وانتهى عند {{run.metrics.dog_final_error_cm}} سم. وقد خرجت البذور السبع التي جُرّبت كلها من فترة الركود، وما قيس منها خرج بين أربعة عشر ألف خطوة وعشرين ألفاً. لا توقف الخلية ما دام الخطأ ثابتاً. فخطأ الموضع هو كل ما تُكافأ عليه الشبكة، والخروج من الركود يأتي متأخراً.

  - type: cell
    id: train_control
    ref: train_control
    title: {en: "Train the Gaussian twin", ar: "درّب التوأم الغاوسي"}
    phase: train
    captures: [train_minutes_control]
    caption:
      en: >-
        The same walks in the same order, from the same starting weights. In the plot, the horizontal axis is training steps and the vertical one is position error in centimetres. The blue curve drops within a few thousand steps; the orange one gets there much later and settles higher. If the blue one never comes down, the twin did not learn the task and nothing later about it means anything.
      ar: >-
        المسارات نفسها بالترتيب نفسه، ومن الأوزان الابتدائية نفسها. في الرسم، المحور الأفقي خطوات التدريب، والعمودي خطأ الموضع بالسنتيمترات. ينخفض المنحنى الأزرق خلال بضعة آلاف من الخطوات، أما البرتقالي فيصل متأخراً كثيراً ويستقر أعلى منه. فإن لم ينخفض المنحنى الأزرق أبداً، فالتوأم لم يتعلم المهمة، وكل ما سنقوله عنه لاحقاً بلا معنى.

  - type: prose
    title: {en: "Learn to read a map", ar: "تعلّم قراءة الخريطة"}
    phase: observe
    text:
      en: >-
        To see what a hidden unit represents, walk the trained network through
        thousands of fresh trajectories and average that unit's activity in
        each square of a {{scale.map_res}}×{{scale.map_res}} floor grid. The
        result is its firing map. To score it, correlate the map with shifted
        copies of itself, which turns any repeating pattern into a ring of peaks
        around the centre. Rotate that picture. A hexagonal lattice matches
        itself at 60° and 120° and clashes at 30°, 90° and 150°; the grid score
        is the gap between the two. Squares and stripes score near or below
        zero.
      ar: >-
        لكي ترى هل تحمل وحدةٌ مخفية <Term en="Spatial Representation">تمثيلاً مكانياً</Term>، مرّر الشبكة المدرَّبة عبر آلاف المسارات الجديدة، واحسب متوسط نشاط تلك الوحدة في كل مربع من أرضٍ مقسمة إلى {{scale.map_res}}×{{scale.map_res}} مربعاً. الناتج هو خريطة نشاطها. ولكي نقيّم الخريطة، نحسب <Term en="Autocorrelation">ارتباطها الذاتي</Term>: نقارنها بنسخٍ مُزاحة منها. النمط المتكرر ينطبق على نفسه كلما أزحناه دورةً كاملة، وكل إزاحة من هذه تظهر قمةً في الصورة الناتجة. لذلك يتحول أي نمط متكرر إلى حلقة من القمم حول المركز. ثم نُدير هذه الصورة. النمط السداسي ينطبق على نفسه عند 60° و120°، ولا ينطبق عند 30° و90° و150°. والفرق بين الحالتين هو ما نسمّيه «درجة السداسية». أما النمط المربّع والنمط المخطط فينالان درجة قريبة من الصفر أو دونه.

  - type: cell
    id: ratemaps
    ref: ratemaps
    title: {en: "Survey both networks", ar: "امسح الشبكتين"}
    phase: observe
    captures: [dog_skill, control_skill]
    caption:
      en: >-
        Skill compares each network with a guess that never leaves the starting point: 1 is perfect, 0 learned nothing. Both must be well above zero before any map below is worth reading. They will not be equal. The Gaussian twin navigates more precisely, {{run.metrics.control_skill}} against {{run.metrics.dog_skill}} in the reference run, and that gap matters for everything that follows.
      ar: >-
        تقارن المهارةُ كل شبكة بتخمينٍ لا يغادر نقطة البداية: الواحد أداء مثالي، والصفر يعني أنها لم تتعلم شيئاً. يجب أن يكون الرقمان أعلى من الصفر بوضوح قبل أن تستحق أي خريطة في الأسفل القراءة. لكنهما لن يتساويا: فالتوأم الغاوسي أدق في الملاحة، إذ بلغت مهارته في التشغيل المرجعي {{run.metrics.control_skill}} مقابل {{run.metrics.dog_skill}}، وهذا الفارق مهم لكل ما يلي.

  - type: cell
    id: gridscore
    ref: gridscore
    title: {en: "Open the hidden units", ar: "افتح الوحدات المخفية"}
    phase: observe
    thumbnail: true
    captures: [grid_percent_dog, grid_percent_untrained, best_grid_score]
    caption:
      en: >-
        The {{scale.units_shown}} highest-scoring hidden units of the centre-surround network, each drawn over the floor of the box, with its grid score above. Look for bumps arranged in triangles — every unit with its own spacing, orientation and offset. At {{scale.map_res}}×{{scale.map_res}} bins the maps are coarse, and a lattice this wide fits only a few periods in the box, so some units show just three or four bumps. The printed line underneath matters as much as the picture. Before training, the same network draws speckled maps, and speckle can score above 1 by pure chance. So a grid unit must also draw the same map from two separate halves of the walks, which a lattice does and speckle never does. This seed is one of the stronger ones; the closing section says how the other seeds went.
      ar: >-
        أعلى {{scale.units_shown}} وحدة مخفية درجةً في شبكة المركز والمحيط، كل واحدة مرسومة على أرض الصندوق وفوقها درجتها. ابحث عن بقع مرتبة في مثلثات، لكل وحدة تباعدها واتجاهها وإزاحتها الخاصة. وبدقة {{scale.map_res}}×{{scale.map_res}} تبقى الخرائط خشنة، ولا يتسع الصندوق إلا لدورات قليلة من نمط بهذا الاتساع، فتُظهر بعض الوحدات ثلاث بقع أو أربعاً فقط. والسطر المطبوع تحت الصورة لا يقل أهمية عنها. فالشبكة نفسها قبل التدريب ترسم خرائط منقّطة عشوائية، وهذا التنقيط قد ينال درجة تتجاوز الواحد بمحض الصدفة. لذلك يجب على الوحدة السداسية أيضاً أن ترسم الخريطة نفسها من نصفين منفصلين من المسارات، وهذا ما يفعله النمط السداسي ولا يفعله التنقيط أبداً. وهذه البذرة من أقوى البذور؛ ويبيّن القسم الختامي ما جرى في البذور الأخرى.

  - type: cell
    id: control_maps
    ref: control_maps
    title: {en: "Compare the Gaussian twin", ar: "قارن بالتوأم الغاوسي"}
    phase: observe
    captures: [grid_percent_control, grid_advantage_points, dog_median_score, control_median_score, median_gap]
    caption:
      en: >-
        First the twin's best stable units, laid out the same way. A few can score well while showing a single blob: the score is not a perfect detector, which is why the percentages carry the result and no single map does. Then the distribution of grid scores over all active units, orange for centre-surround, blue for Gaussian, the dashed line at the cut and a solid line at each distribution's median, and beside it the autocorrelogram of one steady grid unit. In a clean lattice the peaks nearest the centre form a hexagon; at this resolution expect that pattern to show through noise, not crisply.
      ar: >-
        أولاً أفضل وحدات التوأم المستقرة، مرتبة بالطريقة نفسها. وقد ينال بعضها درجة عالية وهو لا يُظهر إلا بقعة واحدة. فالدرجة ليست كاشفاً مثالياً، ولهذا نبني الحكم على النسب المئوية، لا على خريطة بعينها. ثم توزيع الدرجات على كل الوحدات النشطة: البرتقالي للمركز والمحيط، والأزرق للغاوسي، والخط المتقطع عند العتبة، وخط متصل عند وسيط كل توزيع. وبجانبه خريطة الارتباط الذاتي لوحدة سداسية مستقرة. في النمط النظيف تشكّل أقرب القمم إلى المركز شكلاً سداسياً. وبهذه الدقة، توقّع أن يظهر هذا الشكل وسط التشويش، لا واضحاً حادّ الحواف.

  - type: prose
    title: {en: "Ask what caused hexagons", ar: "اسأل ما الذي صنع السداسيات"}
    phase: interpret
    text:
      en: >-
        In this run {{run.metrics.grid_percent_dog}}% of the centre-surround network's active units were stable grid units, against {{run.metrics.grid_percent_control}}% for its twin and {{run.metrics.grid_percent_untrained}}% for the same weights before training. Its median grid score was {{run.metrics.dog_median_score}}, the twin's {{run.metrics.control_median_score}}. The twin was also the better navigator, so hexagons are not what path integration needs here.


        That result belongs to one seed, and the seed was chosen. A seed sets the place-cell layout, the walks and the starting weights together. Before any outcome was known, seven seeds were fixed and the centre-surround network was trained on each. All seven learned to navigate. Their shares of stable grid units were 1.0, 3.5, 4.1, 11.7, 12.8, 16.6 and 22.4%, and four of them cleared 8%. This notebook uses the 16.6% seed: the second strongest, and one whose run repeated exactly in separate sessions.


        Two things held. The twin navigated more precisely in all four seeds where both networks were trained. And the centre-surround scores sat above the twin's as a whole even where the lattice barely formed: in the two weakest seeds, with grid shares close to the untrained floor, the median gap was still 0.15 and 0.19. The lean toward sixfold structure was consistent. The lattice it produces was not.


        Sorscher, Mel, Ganguli and Ocko proposed the mechanism in 2019. A surround penalises both very broad and very fine spatial patterns, so the target favours units built around one preferred spatial frequency. Firing rates cannot go negative, and among single-frequency patterns under that constraint, the triangular lattice wins. That describes what the objective favours, not whether a particular training run gets there. A finite run at this scale moves toward it by an amount that depends on the seed.


        Schaeffer, Khona and Fiete argued in 2022 that emergence in these models depends on choices a modeller makes and is more fragile than it first appeared, and that a network reproducing a brain's pattern is evidence about the objective, not proof that the brain is optimising it. Seven seeds here are a small instance of the same point.


        One caution before leaning on the navigation gap. Position is decoded from the three most active predicted place cells, and about three quarters of the centre-surround code is a nearly flat floor, so its peak is harder to read. Part of the gap may come from a harder readout rather than worse integration, and this run cannot separate the two.


        The hexagons were never asked for. The shape of the target asked for them, one step removed. It asks on every run; the lattice answers only on some.
      ar: >-
        في هذا التشغيل كانت {{run.metrics.grid_percent_dog}}% من الوحدات النشطة في شبكة المركز والمحيط وحداتٍ سداسية مستقرة، مقابل {{run.metrics.grid_percent_control}}% في توأمها، و{{run.metrics.grid_percent_untrained}}% في الشبكة نفسها بأوزانها قبل التدريب. وبلغ وسيط درجاتها {{run.metrics.dog_median_score}}، ووسيط درجات التوأم {{run.metrics.control_median_score}}. غير أن التوأم كان الأدق في الملاحة. ولو كانت السداسيات شرطاً لتكامل المسار، لكانت الشبكة الأدق هي الأغنى بها. فالسداسيات إذن ليست ما يحتاجه تكامل المسار هنا.


        لكن هذه النتيجة تخص بذرة واحدة، وقد اخترناها عن قصد. فالبذرة تحدد مواضع خلايا المكان والمسارات والأوزان الابتدائية معاً. وقبل أن نعرف أي نتيجة، ثبّتنا سبع بذور ودرّبنا شبكة المركز والمحيط على كل منها. تعلّمت السبع كلها الملاحة. وكانت حصص الوحدات السداسية المستقرة فيها 1.0 و3.5 و4.1 و11.7 و12.8 و16.6 و22.4%، وتجاوزت أربعٌ منها عتبة 8%. تستخدم هذه الورشة البذرة ذات الـ16.6%، وهي الثانية قوةً، وقد أعدنا تشغيلها في جلسات منفصلة فجاءت النتيجة متطابقة.


        وثبت أمران عبر البذور. الأول: كان التوأم الأدق في الملاحة في البذور الأربع التي دُرّبت فيها الشبكتان كلتاهما. والثاني: بقيت درجات شبكة المركز والمحيط في مجملها أعلى من درجات التوأم، حتى حين لم يكد النمط يتشكل. ففي أضعف بذرتين، وحصتاهما قريبتان من مستوى الشبكة غير المدرَّبة، بقي فارق الوسيط 0.15 و0.19. الميل نحو البنية السداسية كان ثابتاً، أما النمط الذي ينتج عنه فلم يكن كذلك.


        اقترح سورشر وميل وغانغولي وأوكو عام 2019 آليةً تفسّر ذلك. الطوق الكابح يعاقب الأنماط المكانية الواسعة جداً والدقيقة جداً في آنٍ واحد. فيميل هذا الهدف إلى وحداتٍ مبنية حول تردد مكاني واحد مفضّل، أي وحداتٍ تتكرر قممها بتباعدٍ واحد تقريباً. وهناك قيد آخر: معدلات النشاط لا يمكن أن تكون سالبة. ومن بين الأنماط المبنية على تردد واحد، يفوز النمط المثلثي تحت هذا القيد. هذا يصف ما تفضّله <Term en="Objective Function">دالة الهدف</Term>، لا ما إذا كان تشغيلٌ بعينه سيبلغه. فالتشغيل المحدود بهذا الحجم يقترب منه بمقدارٍ يتوقف على البذرة.


        ثم رأى شيفر وخونا وفيتي عام 2022 أن <Term en="Emergent Representation">التمثيلات الناشئة</Term> في هذه النماذج مرهونةٌ باختيارات يتخذها من يبني النموذج، وأنها أهشّ مما بدا أول الأمر. ورأوا كذلك أن الشبكة حين تعيد إنتاج نمطٍ نراه في الدماغ، فهذا دليلٌ على طبيعة دالة الهدف، لا برهانٌ على أن الدماغ يحسّن الدالة نفسها. والبذور السبع هنا مثال صغير على الفكرة نفسها.


        وقبل أن تبني الكثير على فارق الملاحة، تنبّه إلى أمر. الموضع يُستخرج من أنشط ثلاث خلايا مكان في التنبؤ. ونحو ثلاثة أرباع شيفرة المركز والمحيط أرضيةٌ شبه مسطحة، فقمّتها أصعب قراءةً. قد يعود جزء من الفارق إذن إلى صعوبة القراءة، لا إلى ضعف التكامل. وهذا التشغيل لا يستطيع الفصل بين الاثنين.


        لم يطلب أحدٌ السداسيات. شكلُ الهدف هو الذي طلبها، وإن بطريقٍ غير مباشر. وهو يطلبها في كل تشغيل، لكن النمط لا يستجيب إلا في بعض التشغيلات.

  - type: paperRef
    slug: recurrent-neural-network
    title: {en: "Revisit the recurrent network", ar: "عُد إلى الشبكة التكرارية"}
    phase: interpret
    note:
      en: "The entire map of the room is stored in one vector updated by the same weights at every step."
      ar: >-
        في <Term en="Recurrent Neural Network (RNN)">الشبكة التكرارية</Term> تُحفظ خريطة الغرفة كلها في متجه واحد، تحدّثه الأوزان نفسها في كل خطوة.

  - type: paperRef
    slug: backpropagation-through-time
    title: {en: "Revisit backprop through time", ar: "عُد إلى الانتشار العكسي عبر الزمن"}
    phase: interpret
    note:
      en: "Every walk is unrolled over all of its steps; the lattice is shaped by gradients that cross every one of them."
      ar: >-
        مع <Term en="Backpropagation Through Time">الانتشار العكسي عبر الزمن</Term> يُفرد كل مسار على طول خطواته، والنمط السداسي تصوغه تدرّجات تعبر تلك الخطوات جميعها.

  - type: exercise
    id: longer-walks
    ref: exercise
    title: {en: "Walk past the training horizon", ar: "امشِ أبعد من أفق التدريب"}
    phase: stretch
    prompt:
      en: >-
        The network never saw a walk longer than {{scale.seq_len}} steps. Raise LENGTH_MULTIPLE and score only the steps beyond that horizon. The top row redraws the best units from before; the bottom row is the same units on long walks. The printout compares position error in centimetres inside and beyond the horizon, next to the error of always guessing the box centre. Decide which breaks first, the position readout or the lattice, and what that says about where the network keeps its sense of place.
      ar: >-
        لم ترَ الشبكة قط مساراً أطول من {{scale.seq_len}} خطوة، وهنا تختبر <Term en="Generalization">تعميمها</Term> على مسارات أطول. ارفع قيمة <bdi dir="ltr">LENGTH_MULTIPLE</bdi>، ولا تقيّم إلا الخطوات الواقعة بعد ذلك الأفق. الصف العلوي يعيد رسم أفضل الوحدات كما كانت، والصف السفلي يرسم الوحدات نفسها على المسارات الطويلة. ويقارن السطر المطبوع خطأ الموضع بالسنتيمترات داخل الأفق وبعده، إلى جانب خطأ من يخمّن مركز الصندوق دائماً. قرّر أيهما ينكسر أولاً: طبقة قراءة الموضع أم النمط السداسي؟ وماذا يخبرك ذلك عن المكان الذي تحتفظ فيه الشبكة بإحساسها بالموقع؟
    hint: 1

  - type: paperRef
    slug: long-short-term-memory
    title: {en: "Weigh the gated alternative", ar: "وازن البديل ذا البوابات"}
    phase: stretch
    note:
      en: "DeepMind's 2018 grid-cell agent used an LSTM; here a plain ReLU recurrence is enough, which makes gating an option, not a precondition."
      ar: >-
        استخدم وكيلُ خلايا الشبكة الذي قدّمته ديب مايند عام 2018 شبكةَ <bdi dir="ltr">LSTM</bdi>. أما هنا فيكفي تكرار بسيط بتفعيل <bdi dir="ltr">ReLU</bdi>، فالبوابات خيارٌ متاح، لا شرطٌ مسبق.

  - type: paperRef
    slug: neural-turing-machine
    title: {en: "Contrast addressable memory", ar: "قارن بالذاكرة ذات العناوين"}
    phase: stretch
    note:
      en: "A Neural Turing Machine writes to a location it can look up. This network has no address to write to — the lattice is how it indexes space instead."
      ar: >-
        آلة تورنغ العصبية تكتب في موقع تستطيع أن ترجع إليه. أما هذه الشبكة فلا تملك عنواناً تكتب فيه، وبدلاً من العناوين يصبح النمط السداسي طريقتها في فهرسة المكان.

  - type: cell
    id: verify
    ref: verify
    title: {en: "Verify the three claims", ar: "تحقّق من الادعاءات الثلاثة"}
    phase: verify
    caption:
      en: "Navigation first; the grid comparison is only meaningful if both networks passed it."
      ar: >-
        الملاحة أولاً؛ فمقارنة الأنماط السداسية لا معنى لها إلا إذا نجحت الشبكتان في هذا الاختبار.

  - type: cell
    id: finish
    ref: finish
    title: {en: "Collect the receipt", ar: "استلم الإيصال"}
    phase: verify
    caption:
      en: "Your completion code and the provenance of this run."
      ar: "رمز الإكمال، وما يوثّق مصدر هذا التشغيل."