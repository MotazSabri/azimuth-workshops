schema: workshop/v1
id: fit-your-own-scaling-law
constellation: language

title:
  en: "Fit Your Own Scaling Law"
  ar: "قِس قانون التوسّع بنفسك"

concept:
  en: "A scaling law is a measurement, not a constant"
  ar: "قانون التوسّع نتيجة قياس، وليس ثابتاً"

scenario:
  en: >-
    You can afford one model at a compute budget you have never trained at.
    How big should it be, and how much data should it see? The literature
    offers a famous answer: about 20 training tokens per parameter. But that
    number was measured, on someone else's models, data and tokenizer. In this
    notebook you measure your own. You train a few dozen tiny byte-level
    language models, fit power laws to the best of them, and commit to a model
    size and a loss for a budget {{scale.holdout_factor}}× beyond anything you
    trained. Then you train at that budget and see how far off you were. On
    this setup the law comes out as N ∝ C^{{run.metrics.a_measured}}, close to
    the older paper's exponent rather than the newer one's. And the best split
    is not a constant: it falls from {{run.metrics.ratio_first}} bytes per
    parameter at the smallest budget to {{run.metrics.holdout_ratio}} at the
    held-out one.
  ar: >-
    لديك ميزانية حوسبة لم تدرّب عندها أيّ نموذج من قبل، وهي لا تكفي إلا لنموذج واحد.
    ما الحجم المناسب لهذا النموذج؟ وكم من البيانات يجب أن يقرأ؟
    في الأدبيات جواب مشهور: نحو 20 رمزاً تدريبياً لكل معامل.
    لكنّ هذا الرقم جاء من قياس، على نماذج غيرك وبياناته ومُرمِّزه.
    في هذا الدفتر تقيس رقمك أنت.
    تدرّب بضع عشرات من النماذج اللغوية الصغيرة التي تقرأ النص بايتاً بايتاً، ثم توفّق قوانين قوة على أفضلها.
    بعد ذلك تلتزم بحجم نموذج وبقيمة خسارة، لميزانية أكبر بـ{{scale.holdout_factor}} مرات من كل ما درّبته.
    ثم تدرّب عند تلك الميزانية فعلاً، وترى كم ابتعد توقّعك عن الواقع.
    في هذا الإعداد يخرج القانون على الشكل <bdi dir="ltr">N ∝ C^{{run.metrics.a_measured}}</bdi>.
    وهذا الأُسّ قريب من أُسّ الورقة الأقدم، لا من أُسّ الورقة الأحدث.
    ثم إنّ أفضل تقسيم ليس ثابتاً.
    فهو ينخفض من {{run.metrics.ratio_first}} بايتاً لكل معامل عند أصغر ميزانية، إلى {{run.metrics.holdout_ratio}} عند الميزانية المحجوزة.

goal:
  en: >-
    Predict the best model size and its loss at a budget
    {{scale.holdout_factor}}× larger than any fitted point. Then train at that
    budget, measure, and land within the declared error.
  ar: >-
    أن تتوقّع أفضل حجم للنموذج وخسارته عند ميزانية أكبر بـ{{scale.holdout_factor}} مرات من أيّ نقطة دخلت في التوفيق.
    ثم أن تدرّب عند تلك الميزانية وتقيس، فيأتي الفرق بين التوقّع والقياس ضمن حدّ الخطأ المعلن.

difficulty: intermediate
status: stable
publishedAt: "2026-10-02"

maintenance:
  tier: moderate               # arabic-reshaper and python-bidi, pinned below
  cadence: quarterly

estimate:
  gpuMinutes: 14               # estimated from the first T4 run's step rate; re-measure
  totalMinutes: 35

papers:
  - slug: chinchilla
    role: core
    label:
      en: "the IsoFLOP method, the parametric loss surface, and the 20-tokens-per-parameter result we test against"
      ar: "طريقة منحنيات الحوسبة الثابتة، وسطح الخسارة المعلَمي، ونتيجة الـ20 رمزاً لكل معامل التي نقارن بها قياسنا"
  - slug: scaling-laws
    role: core
    label:
      en: "the idea that loss follows power laws in parameters, data and compute, and the non-embedding parameter count"
      ar: "فكرة أنّ الخسارة تتبع قوانين قوة في المعاملات والبيانات والحوسبة، وطريقة عدّ المعاملات دون جداول التضمين"
  - slug: gpt-3
    role: supporting
    label:
      en: "a model sized by the earlier rule, which the compute-optimal frontier later called undertrained"
      ar: "نموذج حُدّد حجمه بالقاعدة الأقدم، ثم تبيّن لاحقاً، بمقياس الحدّ الأمثل حوسبياً، أنه لم يُدرَّب بما يكفي"

assets:
  - name: tinystories-v2-head.txt
    bytes: 47999618
    sha256: 7b6c11b3070b5fecd9650fb40d76cd097dabdb9c4865bc2f3dba011b4c2381d7
