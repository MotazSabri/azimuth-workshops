dependencies:
  pip:
    - "arabic-reshaper==3.0.0"
    - "python-bidi==0.4.2"

profiles:
  - id: free
    default: true
    name:
      en: "Free tier (T4)"
      ar: "المستوى المجاني (<bdi dir=\"ltr\">T4</bdi>)"
    requires:
      gpu: true
      vramGb: 1                # the first T4 run peaked at 0.23 GB; re-check after the next
      ramGb: 3
    scale:
      seed: 17
      corpus_bytes: 48000000
      val_bytes: 1000000
      context: 128
      batch: 16
      lr: 0.006                # peak learning rate at width lr_width
      lr_width: 32             # the rate falls with the square root of width
      init_std: 0.02
      layers: 2
      heads: 2
      width_min: 8
      width_max: 224
      width_step: 4
      budget_min: 1000000000000
      budget_factor: 2
      n_budgets: 4
      ratio_min: 3
      ratio_max: 450
      n_ratios: 7
      min_tokens: 2000000
      holdout_factor: 4

# Thresholds come from a full CPU run of this code on the real corpus (same
# seeds, same float32 arithmetic as the GPU). Re-check them against the first
# T4 run; they are set with room below or above each measured value.
checks:
  - id: runs-learned
    required: true
    min: 0.8
    label:
      en: "Smallest gain over the unigram baseline across all grid runs, in nats per byte"
      ar: "أصغر تحسّن عن خط الأساس الأحادي بين كل تشغيلات الشبكة، بوحدة نات لكل بايت"
  - id: optima-bracketed
    required: true
    min: 0.75
    label:
      en: "Share of fitted budgets whose best model size has a smaller and a larger run on either side"
      ar: "نسبة ميزانيات التوفيق التي يقع أفضل حجم فيها بين تشغيل أصغر منه وتشغيل أكبر منه"
  - id: frontier-fit
    required: true
    min: 0.9
    label:
      en: "How well a power law describes best size against compute (coefficient of determination, in log space)"
      ar: "مدى مطابقة قانون القوة لأفضل حجم مقابل الحوسبة (معامل التحديد على المقياس اللوغاريتمي)"
  - id: prediction-error
    required: true
    max: 10
    label:
      en: "Gap between the predicted loss and the best loss measured at the held-out budget, as a percentage"
      ar: "الفرق بين الخسارة المتوقَّعة وأفضل خسارة مقيسة عند الميزانية المحجوزة، كنسبة مئوية"

hints:
  - en: >-
      A pure power law is a straight line on log-log axes, and it keeps
      falling forever. A floor makes the curve bend away from that line and
      level off. Far to the right, which of the two predicts the lower loss?
    ar: >-
      قانون القوة الخالص خط مستقيم على المحورين اللوغاريتميين، ويستمرّ في الهبوط بلا نهاية.
      أما الأرضية فتجعل المنحنى ينحني مبتعداً عن هذا الخط، ثم يستوي.
      فأيّهما يتوقّع خسارة أدنى حين تبتعد كثيراً إلى اليمين؟
  - en: >-
      The embedding tables hold (256 + context length) × width parameters.
      For the narrowest models that is a large share of the whole network; for
      the widest it is a small one. Removing them shrinks small models more
      than large ones. What does that do to the slope of size against compute?
    ar: >-
      في جداول التضمين ‎(256 + طول السياق) × العرض من المعاملات.
      في أضيق النماذج يشكّل هذا جزءاً كبيراً من الشبكة كلها، وفي أعرضها جزءاً صغيراً.
      لذلك يُصغّر حذفُها النماذجَ الصغيرة أكثر مما يُصغّر الكبيرة.
      فماذا يفعل ذلك بميل الحجم مقابل الحوسبة؟
  - en: >-
      A bad start costs a run a roughly fixed number of steps before it begins
      to learn. Which run loses a larger share of its training to that: one
      with a thousand steps, or one with five thousand? And on which side of
      the valley do the short runs sit?
    ar: >-
      البداية السيئة تكلّف التشغيل عدداً شبه ثابت من الخطوات قبل أن يبدأ التعلّم.
      فأيّ تشغيل يخسر حصّة أكبر من تدريبه بسبب ذلك: تشغيل من ألف خطوة، أم تشغيل من خمسة آلاف؟
      وعلى أيّ جانب من الوادي تقع التشغيلات القصيرة؟

terms:
  "Scaling Law":
    en: "An empirical rule, usually a power law, relating a model's loss to its size, its data or its compute. Fitted to measurements, not derived."
    ar: "قاعدة تجريبية، غالباً على شكل قانون قوة، تربط خسارة النموذج بحجمه أو ببياناته أو بحوسبته. تُستخرج بالتوفيق على قياسات، ولا تُشتقّ نظرياً."
  "Compute-Optimal":
    en: "The split of a fixed compute budget between parameters and training tokens that gives the lowest loss."
    ar: "تقسيم ميزانية حوسبة ثابتة بين المعاملات ورموز التدريب على النحو الذي يعطي أدنى خسارة."
  "Chinchilla Scaling":
    en: "The 2022 finding that parameters and training tokens should grow roughly equally with compute, about 20 tokens per parameter for that setup."
    ar: "نتيجة عام 2022: يجب أن تنمو المعاملات ورموز التدريب بالمعدّل نفسه تقريباً مع الحوسبة، بنحو 20 رمزاً لكل معامل في ذلك الإعداد."
  "Model Scale":
    en: "How big a model is, usually counted in parameters."
    ar: "حجم النموذج، ويُقاس عادةً بعدد معاملاته."
  "Compute Budget":
    en: "The total compute you will spend on training, measured in FLOPs. Here, C ≈ 6 × parameters × tokens."
    ar: "مجموع الحوسبة التي ستنفقها على التدريب، بوحدة <bdi dir=\"ltr\">FLOPs</bdi>. وهي هنا تقارب 6 × عدد المعاملات × عدد الرموز."
  "Training FLOPs":
    en: "Floating-point operations spent on training. For a transformer, about 6 per parameter per token: 2 for the forward pass and 4 for the backward pass."
    ar: "عمليات الفاصلة العائمة المنفقة في التدريب. في المحوّل تبلغ نحو 6 لكل معامل ولكل رمز: 2 في المرور الأمامي، و4 في المرور الخلفي."
  "Loss":
    en: "The number training pushes down. Here it is the average cross-entropy per byte on held-out text."
    ar: "الرقم الذي يدفعه التدريب إلى الأسفل. وهو هنا متوسط الإنتروبيا المتقاطعة لكل بايت، على نص لم يُستخدم في التدريب."
  "Loss Function":
    en: "The function that scores a model's predictions against the truth. Training minimizes it."
    ar: "الدالة التي تقيّم توقّعات النموذج مقارنةً بالحقيقة. والتدريب يسعى إلى تصغيرها."
  "Cross-Entropy Loss":
    en: "The average negative log-probability the model gives to the byte that actually came next, measured in nats."
    ar: "متوسط سالب لوغاريتم الاحتمال الذي يعطيه النموذج للبايت الذي جاء فعلاً، بوحدة النات."
  "Dataset":
    en: "The text the models learn from. Here, simple English stories, read as raw bytes."
    ar: "النص الذي تتعلّم منه النماذج. وهو هنا قصص إنجليزية بسيطة تُقرأ بايتاتٍ خاماً."
  "Data Efficiency":
    en: "How much loss a model removes per training token. Larger models are usually more data-efficient."
    ar: "مقدار الخسارة الذي يزيله النموذج مقابل كل رمز تدريب. والنماذج الأكبر أكفأ عادةً في استخدام البيانات."
  "Generalization":
    en: "Performance on data the model did not train on. Every loss in this notebook is measured on held-out bytes."
    ar: "الأداء على بيانات لم يتدرّب عليها النموذج. كل خسارة في هذا الدفتر تُقاس على بايتات محجوزة خارج التدريب."
  "Extrapolation (Statistical)":
    en: "Using a fitted curve outside the range of the data it was fitted to. The held-out budget tests exactly this."
    ar: "استخدام منحنى مُوفَّق خارج مدى البيانات التي وُفِّق عليها. والميزانية المحجوزة تفحص هذا بالضبط."
  "Interpolation (Statistical)":
    en: "Using a fitted curve inside the range of its data. Much safer than extrapolation."
    ar: "استخدام منحنى مُوفَّق داخل مدى بياناته. وهو أكثر أماناً بكثير من الاستقراء الخارجي."
  "Power Law":
    en: "A relation y = k · x^p. It is a straight line on log-log axes, with slope p."
    ar: "علاقة من الشكل <bdi dir=\"ltr\">y = k · x^p</bdi>. تظهر خطاً مستقيماً على محورين لوغاريتميين، ميله <bdi dir=\"ltr\">p</bdi>."
  "Model Efficiency & Scaling":
    en: "How a model's quality grows with the resources spent on it, and how to spend those resources well."
    ar: "كيف تتحسّن جودة النموذج مع الموارد التي تُنفق عليه، وكيف تُنفق هذه الموارد بحكمة."
  "Compute-Optimal Frontier":
    en: "The curve of lowest achievable loss at each compute budget, traced by the best model at each budget."
    ar: "منحنى أدنى خسارة ممكنة عند كل ميزانية حوسبة، ترسمه أفضل النماذج عند كل ميزانية."
  "IsoFLOP Curve":
    en: "Loss against model size for runs that all spend the same compute. Its minimum is the best size for that budget."
    ar: "الخسارة مقابل حجم النموذج، لتشغيلات تنفق كلها الحوسبة نفسها. وأدنى نقطة فيه هي أفضل حجم لتلك الميزانية."
  "Diminishing Returns":
    en: "Each doubling of compute buys a smaller drop in loss than the one before."
    ar: "كل مضاعفة للحوسبة تشتري انخفاضاً في الخسارة أصغر من الانخفاض الذي اشترته المضاعفة السابقة."
  "Large Language Model":
    en: "A transformer language model with billions of parameters. Laws like the ones measured here on tiny models are what such models are planned with."
    ar: "نموذج لغوي من نوع المحوّل فيه مليارات المعاملات. وبقوانين كالتي نقيسها هنا على نماذج صغيرة يُخطَّط لهذه النماذج."
  "Irreducible Loss":
    en: "The floor E that a loss curve approaches but never crosses, however much compute is spent. Part of it is the true entropy of the text."
    ar: "الأرضية <bdi dir=\"ltr\">E</bdi> التي يقترب منها منحنى الخسارة ولا يتجاوزها، مهما زادت الحوسبة. وجزء منها هو الإنتروبيا الحقيقية للنص."
  "Scaling Coefficient":
    en: "The exponent of a fitted power law. Here, a in N_opt ∝ C^a and b in D_opt ∝ C^b."
    ar: "أُسّ قانون القوة المُوفَّق. وهو هنا <bdi dir=\"ltr\">a</bdi> في <bdi dir=\"ltr\">N_opt ∝ C^a</bdi>، و<bdi dir=\"ltr\">b</bdi> في <bdi dir=\"ltr\">D_opt ∝ C^b</bdi>."
  "Parameter Count":
    en: "How many trainable numbers a model has. Whether embedding tables are counted changes the scaling law you measure."
    ar: "عدد القيم القابلة للتدريب في النموذج. وإدخال جداول التضمين في العدّ أو استبعادها يغيّر قانون التوسّع الذي تقيسه."
  "Training Tokens":
    en: "How many tokens the model reads during training. Here a token is one byte, and no run reads any byte twice."
    ar: "عدد الرموز التي يقرؤها النموذج أثناء التدريب. والرمز هنا بايت واحد، ولا يقرأ أيّ تشغيل البايت نفسه مرتين."

body:
  # ── Frame ───────────────────────────────────────────────────────────────
  - type: prose
    title: { en: "Start from the claim", ar: "ابدأ من الادّعاء" }
    phase: { en: "Frame", ar: "التأطير" }
    text:
      en: >-
        In 2020, Kaplan and colleagues measured how a language model's
        <Term en="Loss">loss</Term> falls as you add parameters, data and
        compute. Each relation was a <Term en="Power Law">power law</Term>,
        and their advice was to spend most of a growing budget on bigger
        models. In 2022, the Chinchilla paper ran the measurement again, more
        carefully, and reached a different answer: grow parameters and
        <Term en="Training Tokens">training tokens</Term> together, at about
        20 tokens per parameter.


        Neither result was derived from first principles. Both came from
        training many models, plotting the results, and fitting curves. That
        means you can do the same thing on a single GPU. The numbers you get
        will be your own, and that is the point of this notebook.
      ar: >-
        في عام 2020 قاس <bdi dir="ltr">Kaplan</bdi> وزملاؤه كيف تنخفض <Term en="Loss">خسارة</Term> النموذج اللغوي
        كلما زادت المعاملات والبيانات والحوسبة.
        جاءت كل علاقة من هذه العلاقات على شكل <Term en="Power Law">قانون قوة</Term>.
        وكانت نصيحتهم: إذا كبرت الميزانية، فأنفق معظم الزيادة على تكبير النموذج.
        في عام 2022 أعادت ورقة <bdi dir="ltr">Chinchilla</bdi> القياس بعناية أكبر، فوصلت إلى جواب مختلف.
        الجواب الجديد: كبّر المعاملات و<Term en="Training Tokens">رموز التدريب</Term> معاً، بنحو 20 رمزاً لكل معامل.


        لم يُستنتج أيٌّ من الجوابين من مبادئ أولى.
        كلاهما جاء من تدريب نماذج كثيرة، ثم رسم نتائجها، ثم توفيق منحنيات عليها.
        وهذا يعني أنك تستطيع أن تفعل الشيء نفسه على معالج رسومي واحد.
        الأرقام التي ستحصل عليها ستكون أرقامك أنت، وهذا بالضبط ما يريد هذا الدفتر أن يريك إياه.

  - type: paperRef
    slug: training-compute-optimal-large-language-models
    title: { en: "Read the Chinchilla method", ar: "اقرأ طريقة <bdi dir=\"ltr\">Chinchilla</bdi>" }
    phase: { en: "Frame", ar: "التأطير" }
    note:
      en: "Section 3 describes the three approaches. This notebook runs Approach 2 (IsoFLOP curves) and Approach 3 (a parametric loss surface) on the same runs."
      ar: >-
        يصف القسم الثالث من الورقة الطرق الثلاث.
        ينفّذ هذا الدفتر الطريقة الثانية، أي منحنيات الحوسبة الثابتة،
        والطريقة الثالثة، أي سطح الخسارة المعلَمي، وكلتاهما على التشغيلات نفسها.

  - type: paperRef
    slug: empirical-scaling-laws-for-language-models
    title: { en: "Read the earlier law", ar: "اقرأ القانون الأقدم" }
    phase: { en: "Frame", ar: "التأطير" }
    note:
      en: "Kaplan et al. counted parameters without the embedding tables. An exercise near the end shows what that choice does to the exponent."
      ar: >-
        عدّ <bdi dir="ltr">Kaplan</bdi> وزملاؤه المعاملات دون جداول التضمين.
        ويبيّن أحد التمارين الأخيرة ما يفعله هذا الاختيار بالأُسّ.

  - type: cell
    id: setup
    ref: setup
    title: { en: "Load the workshop", ar: "حمّل الورشة" }
    phase: { en: "Frame", ar: "التأطير" }
    caption:
      en: "Check the code hash and that a GPU is attached. The grid needs one."
      ar: "تحقّق من بصمة الشيفرة، ومن أنّ معالجاً رسومياً متّصل. فالشبكة تحتاج إليه."

  # ── Measure ─────────────────────────────────────────────────────────────
  - type: prose
    title: { en: "Read text as bytes", ar: "اقرأ النص بايتات" }
    phase: { en: "Measure", ar: "القياس" }
    text:
      en: >-
        The models read raw bytes, so the vocabulary is 256 symbols and there
        is no tokenizer to train or argue about. Every loss is measured in nats
        per byte on text the models never trained on.


        The first number to note is the unigram baseline. It is the loss of a
        model that ignores context and predicts each byte from its overall
        frequency. Every trained model should beat it by a wide margin. If one
        does not, it learned nothing, and a curve fitted through it would be a
        curve through noise.
      ar: >-
        تقرأ النماذج البايتات الخام كما هي.
        لذلك تتكوّن المفردات من 256 رمزاً فقط، ولا يوجد مُرمِّز نحتاج إلى تدريبه أو إلى الاختلاف حوله.
        وكل خسارة تُقاس بوحدة نات لكل بايت، على نص لم تتدرّب عليه النماذج أبداً.


        أول رقم يستحقّ الانتباه هو خط الأساس الأحادي.
        وهو خسارة نموذج يتجاهل السياق تماماً، ويتوقّع كل بايت من تكراره العام في النص.
        كل نموذج مدرَّب يجب أن يتفوّق على هذا الخط بفارق واضح.
        فإذا لم يتفوّق عليه نموذج ما، فهذا النموذج لم يتعلّم شيئاً.
        وأيّ منحنى نوفّقه عبر نقطة كهذه هو منحنى يمرّ عبر ضجيج.

  - type: cell
    id: data
    ref: data
    captures: [unigram_loss]
    title: { en: "Load the stories", ar: "حمّل القصص" }
    phase: { en: "Measure", ar: "القياس" }
    caption:
      en: "The baseline lands near 3 nats per byte. Remember that number; every trained model should end well below it."
      ar: "يقع خط الأساس قرب 3 نات لكل بايت. احفظ هذا الرقم، فكل نموذج مدرَّب يجب أن ينتهي أدنى منه بكثير."

  - type: prose
    title: { en: "Build one family of models", ar: "ابنِ عائلة واحدة من النماذج" }
    phase: { en: "Measure", ar: "القياس" }
    text:
      en: >-
        A scaling law compares models of different sizes, so we need a family
        of them. Ours has one knob. Every model has the same depth, set by
        {{scale.layers}} in the profile, and only the width changes. That
        takes the size from a few thousand
        <Term en="Parameter Count">parameters</Term> to over a million. With
        the depth fixed, two models differ in size and in nothing else.


        Each model is listed with two parameter counts: the total, as
        Chinchilla counted, and the count without the embedding tables, as
        Kaplan counted. The last column shows how much of each model the
        embedding tables take up. For now we use the total. The difference
        returns in an exercise.
      ar: >-
        قانون التوسّع يقارن بين نماذج بأحجام مختلفة، لذلك نحتاج إلى عائلة كاملة منها.
        لعائلتنا مفتاح واحد فقط.
        عدد الطبقات ثابت في كل النماذج، وقيمته في ملف التشغيل هي {{scale.layers}}، والذي يتغيّر هو العرض وحده.
        وبتغيير العرض ينتقل الحجم من بضعة آلاف من <Term en="Parameter Count">المعاملات</Term> إلى أكثر من مليون.
        وتثبيت العمق يضمن أنّ أيّ نموذجين يختلفان في الحجم، ولا يختلفان في شيء آخر.


        بجانب كل نموذج عددان للمعاملات.
        الأول هو العدد الكلي، كما عدّتها ورقة <bdi dir="ltr">Chinchilla</bdi>.
        والثاني هو العدد بعد حذف جداول التضمين، كما عدّها <bdi dir="ltr">Kaplan</bdi>.
        أما العمود الأخير فيبيّن حصّة جداول التضمين من كل نموذج.
        نستخدم العدد الكلي الآن، ونعود إلى الفرق بين العددين في أحد التمارين.

  - type: cell
    id: model
    ref: model
    title: { en: "Define the model family", ar: "عرّف عائلة النماذج" }
    phase: { en: "Measure", ar: "القياس" }
    caption:
      en: "Look at the last column. In the narrowest models the embedding tables are most of the parameters; in the widest they are a small part."
      ar: "انظر إلى العمود الأخير. في أضيق النماذج تشكّل جداول التضمين معظم المعاملات، وفي أعرضها جزءاً صغيراً."

  - type: prose
    title: { en: "Price a run, train it fairly", ar: "احسب كلفة التشغيل ودرّبه بإنصاف" }
    phase: { en: "Measure", ar: "القياس" }
    text:
      en: >-
        Training a transformer with N parameters on D tokens costs about
        C ≈ 6·N·D <Term en="Training FLOPs">floating-point operations</Term>:
        two per parameter per token for the forward pass, four for the
        backward pass. That approximation is what lets us trade N against D at
        a fixed <Term en="Compute Budget">compute budget</Term>.


        A scaling law compares short runs with long ones, and narrow models
        with wide ones. So the trainer has to treat them all fairly, and three
        details in it exist for that reason.


        First, each run's learning-rate schedule is stretched to that run's
        own length. The Chinchilla authors point to one schedule shared by all
        runs as a reason the earlier law favored large models: a loss read
        part-way through a long schedule makes short training look worse than
        it is.


        Second, the embedding table starts with small values. Every run then
        begins from a neutral guess, and does not spend its first steps
        undoing a bad one.


        Third, wider models get a smaller learning rate. With one rate for
        every size, either the narrow models or the wide ones would be trained
        badly.


        These are three simple rules, and none is tuned for an individual run.
        The law you measure belongs to these rules as much as to the models.
        An exercise near the end breaks the second rule on purpose, to show
        what it does.
      ar: >-
        تدريب محوّل فيه <bdi dir="ltr">N</bdi> معاملاً على <bdi dir="ltr">D</bdi> رمزاً
        يكلّف تقريباً <bdi dir="ltr">C ≈ 6·N·D</bdi> من <Term en="Training FLOPs">عمليات الفاصلة العائمة</Term>.
        ومصدر الرقم 6: عمليتان لكل معامل ولكل رمز في المرور الأمامي، وأربع عمليات في المرور الخلفي.
        هذا التقريب هو ما يسمح لنا بالمقايضة بين <bdi dir="ltr">N</bdi> و<bdi dir="ltr">D</bdi>
        عند <Term en="Compute Budget">ميزانية حوسبة</Term> ثابتة.


        قانون التوسّع يقارن تشغيلات قصيرة بأخرى طويلة، ونماذج ضيّقة بأخرى عريضة.
        لذلك يجب أن يعامل المدرِّب الجميع بإنصاف.
        وفيه ثلاثة تفاصيل وُضعت لهذا الغرض.


        الأول: جدول معدّل التعلّم في كل تشغيل يمتدّ على طول ذلك التشغيل نفسه.
        أشار مؤلفو <bdi dir="ltr">Chinchilla</bdi> إلى أنّ استخدام جدول واحد لكل التشغيلات
        كان من أسباب ميل القانون الأقدم إلى النماذج الكبيرة.
        فالخسارة التي تُقرأ في منتصف جدول طويل تجعل التدريب القصير يبدو أسوأ من حقيقته.


        الثاني: جدول التضمين يبدأ بقيم صغيرة.
        بذلك يبدأ كل تشغيل من تخمين محايد، ولا يُنفق خطواته الأولى في إصلاح بداية سيئة.


        الثالث: النماذج الأعرض تأخذ معدّل تعلّم أصغر.
        فلو استخدمنا معدّلاً واحداً لكل الأحجام، لتدرّبت النماذج الضيّقة أو العريضة تدريباً سيئاً.


        هذه ثلاث قواعد بسيطة، ولم نضبط أيّاً منها لتشغيل بعينه.
        والقانون الذي ستقيسه يخصّ هذه القواعد بقدر ما يخصّ النماذج.
        وفي أحد التمارين الأخيرة نكسر القاعدة الثانية عمداً، لنرى أثرها.

  - type: cell
    id: trainer
    ref: trainer
    captures: [probe_loss]
    title: { en: "Train one probe model", ar: "درّب نموذجاً تجريبياً" }
    phase: { en: "Measure", ar: "القياس" }
    caption:
      en: "One small run before the grid. Its loss should already be under the unigram baseline."
      ar: "تشغيل صغير واحد قبل الشبكة. ويجب أن تكون خسارته أدنى من خط الأساس الأحادي منذ الآن."

  - type: prose
    title: { en: "Hold compute fixed", ar: "ثبّت الحوسبة" }
    phase: { en: "Measure", ar: "القياس" }
    text:
      en: >-
        Here is the core of the method. Pick a compute budget C. Train several
        models that all spend exactly C, from a large model on few tokens to a
        small model on many. Plot their losses against size. The result is an
        <Term en="IsoFLOP Curve">IsoFLOP curve</Term>, and its lowest point is
        the best size for that budget. Repeat for several budgets.


        We choose the splits by their tokens-per-parameter ratio, D / N, and
        spread those ratios widely on purpose. We do not know in advance where
        the best split lies, and the method only works if each budget's best
        run has worse runs on both sides of it.
      ar: >-
        هنا قلب الطريقة.
        اختر ميزانية حوسبة <bdi dir="ltr">C</bdi>.
        ثم درّب عدّة نماذج تنفق كلها <bdi dir="ltr">C</bdi> بالضبط:
        من نموذج كبير يقرأ رموزاً قليلة، إلى نموذج صغير يقرأ رموزاً كثيرة.
        بعد ذلك ارسم خسائرها مقابل أحجامها.
        الناتج هو <Term en="IsoFLOP Curve">منحنى الحوسبة الثابتة</Term>
        (<bdi dir="ltr">IsoFLOP</bdi>)، وأدنى نقطة فيه هي أفضل حجم لتلك الميزانية.
        وتكرّر ذلك لعدّة ميزانيات.


        نختار طرق التقسيم بحسب نسبة الرموز إلى المعاملات، <bdi dir="ltr">D / N</bdi>.
        ونوزّع هذه النسب على مدى واسع عن قصد.
        فنحن لا نعرف مسبقاً أين يقع أفضل تقسيم.
        والطريقة لا تنجح إلا إذا وُجدت، في كل ميزانية، تشغيلات أسوأ من أفضل تشغيل على جانبيه كليهما.

  - type: cell
    id: plan
    ref: plan
    title: { en: "Lay out the grid", ar: "ارسم خطة الشبكة" }
    phase: { en: "Measure", ar: "القياس" }
    caption:
      en: "Each row is one budget. As the budget grows, the whole row shifts toward larger models."
      ar: "كل سطر يمثّل ميزانية واحدة. وكلما كبرت الميزانية، انزاح السطر كله نحو نماذج أكبر."

  - type: scaleNote
    title: { en: "Size the grid", ar: "حدّد حجم الشبكة" }
    phase: { en: "Measure", ar: "القياس" }
    text:
      en: >-
        The free profile fits {{scale.n_budgets}} budgets, each
        {{scale.budget_factor}}× the one before, and tries up to
        {{scale.n_ratios}} splits at each. A split is dropped if it would give
        a run fewer than {{scale.min_tokens}} tokens, because so short a run
        has too few optimizer steps to learn anything. It is also dropped if
        it needs more tokens than the corpus holds: no run reads the same byte
        more than once, so repeated data cannot bend the curves.
      ar: >-
        يوفّق المستوى المجاني على {{scale.n_budgets}} ميزانيات،
        وكل ميزانية تساوي السابقة مضروبةً في {{scale.budget_factor}}.
        وعند كل ميزانية يجرّب حتى {{scale.n_ratios}} تقسيمات.
        يُستبعَد أيّ تقسيم يعطي التشغيل أقلّ من {{scale.min_tokens}} رمزاً.
        والسبب أنّ تشغيلاً بهذا القِصر لا يحصل على خطوات تحسين كافية ليتعلّم شيئاً.
        ويُستبعَد كذلك أيّ تقسيم يحتاج رموزاً أكثر مما في النص.
        فلا يقرأ أيّ تشغيل البايت نفسه أكثر من مرة، وبذلك لا تستطيع البيانات المكرّرة أن تحرف المنحنيات.

  - type: cell
    id: grid
    ref: grid
    captures: [n_runs, grid_minutes, worst_margin]
    title: { en: "Train the whole grid", ar: "درّب الشبكة كاملة" }
    phase: { en: "Measure", ar: "القياس" }
    caption:
      en: "The longest cell. Read the table one budget at a time: as N grows, the loss falls and then rises again. Keep an eye on the steps column."
      ar: "أطول خلية في الدفتر. اقرأ الجدول ميزانيةً ميزانية: كلما كبر <bdi dir=\"ltr\">N</bdi> انخفضت الخسارة ثم ارتفعت من جديد. وراقب عمود الخطوات."

  # ── Fit ─────────────────────────────────────────────────────────────────
  - type: cell
    id: figures
    ref: figures
    title: { en: "Prepare the figures", ar: "جهّز الرسوم" }
    phase: { en: "Fit", ar: "التوفيق" }
    caption:
      en: "Plot setup only. In the Arabic notebook it also loads a font that has Arabic glyphs."
      ar: "إعداد للرسوم فقط. وفي الدفتر العربي يحمّل أيضاً خطاً يحتوي الحروف العربية."

  - type: cell
    id: isoflop
    ref: isoflop
    captures: [bracketed_share]
    thumbnail: true
    title: { en: "Find each budget's best size", ar: "جِد أفضل حجم لكل ميزانية" }
    phase: { en: "Fit", ar: "التوفيق" }
    caption:
      en: "Each colour is one budget. The stars mark the bottom of each valley. Watch them move right as compute grows."
      ar: "كل لون يمثّل ميزانية واحدة، والنجوم تحدّد قاع كل وادٍ. راقبها وهي تتحرّك نحو اليمين كلما زادت الحوسبة."

  - type: prose
    title: { en: "Read the valleys", ar: "اقرأ الوديان" }
    phase: { en: "Fit", ar: "التوفيق" }
    text:
      en: >-
        Each curve is a valley. Left of the bottom, models are too small: they
        read plenty of data but had no room to use it. Right of the bottom,
        models are too large for the budget: they had the capacity, but the
        compute ran out after too few tokens. At this scale, too few tokens
        means too few optimizer steps. Look at the steps column in the table:
        the runs on the right wall got little more than a thousand. The star
        is the <Term en="Compute-Optimal">compute-optimal</Term> balance
        between the two.


        A star only counts if it sits between real runs. A parabola can always
        be extended past the last point, but its vertex out there is a guess,
        not a measurement. That is what the bracketing check guards.
      ar: >-
        كل منحنى يشبه وادياً.
        على يسار القاع نماذج أصغر من اللازم: قرأت بيانات وفيرة، لكن لم تكن لديها سعة كافية للاستفادة منها.
        وعلى يمين القاع نماذج أكبر مما تحتمله الميزانية: لديها السعة، لكنّ الحوسبة نفدت بعد رموز قليلة.
        وعند هذا المقياس الصغير، الرموز القليلة تعني خطوات تحسين قليلة.
        انظر إلى عمود الخطوات في الجدول.
        التشغيلات على الجدار الأيمن لم تحصل إلا على ما يزيد قليلاً على ألف خطوة.
        أما النجمة فهي نقطة التوازن <Term en="Compute-Optimal">الأمثل حوسبياً</Term> بين الحالتين.


        لا تُحتسب النجمة إلا إذا وقعت بين تشغيلات حقيقية.
        يمكن دائماً مدّ القطع المكافئ إلى ما بعد آخر نقطة.
        لكنّ رأسه هناك تخمين، وليس قياساً.
        وهذا ما يحرسه فحص الحصر.

  - type: cell
    id: frontier
    ref: frontier
    captures: [a_measured, b_measured, frontier_r2, E_frontier, ratio_first, ratio_last, tokens_first_m, tokens_last_m]
    title: { en: "Fit the frontier", ar: "وفّق الحدّ الأمثل" }
    phase: { en: "Fit", ar: "التوفيق" }
    caption:
      en: "Three fits through the stars: best size, best data, and best loss, each against compute."
      ar: "ثلاثة توفيقات عبر النجوم: أفضل حجم، وأفضل كمية بيانات، وأفضل خسارة، كلٌّ منها مقابل الحوسبة."

  - type: prose
    title: { en: "Compare with the papers", ar: "قارن بالورقتين" }
    phase: { en: "Fit", ar: "التوفيق" }
    text:
      en: >-
        The stars lie close to a straight line in log space: N_opt ∝ C^a, with
        a = {{run.metrics.a_measured}}. Kaplan reported 0.73 and Chinchilla
        0.50. Yours sits at the Kaplan end: when the budget doubles, most of
        the increase goes into parameters.


        The second fit shows the other side of the same fact. The best run's
        token count barely moves: D_opt ∝ C^b, with b =
        {{run.metrics.b_measured}}. It goes from
        {{run.metrics.tokens_first_m}} million tokens at the smallest budget
        to {{run.metrics.tokens_last_m}} million at the largest, while the
        compute doubles several times over. At these budgets a few million
        tokens is a few thousand optimizer steps. A run seems to need about
        that many before its size can pay off. Once it has them, extra compute
        is better spent on parameters.


        So tokens per parameter is not a constant here. At the best split it
        falls from {{run.metrics.ratio_first}} at the smallest budget to
        {{run.metrics.ratio_last}} at the largest. Chinchilla's 20 was a
        measurement of their models, their tokenizer and their data, at
        budgets many orders of magnitude above ours. It does not carry over to
        this setup, and our numbers would not carry over to theirs. One
        difference is the unit itself: a byte carries much less information
        than a tokenizer's token, which usually spans several characters.


        The third fit is the loss frontier, L_opt(C) = E + A·C^(−α). It shows
        <Term en="Diminishing Returns">diminishing returns</Term>: each
        doubling of compute removes less loss than the one before. It also has
        a floor, E = {{run.metrics.E_frontier}} nats per byte: the level this
        family of models approaches but would not cross, however large the
        budget. That floor is the <Term en="Irreducible Loss">irreducible
        loss</Term>, as these few points see it.
      ar: >-
        تقع النجوم قرب خط مستقيم على المقياس اللوغاريتمي.
        أي أنّ <bdi dir="ltr">N_opt ∝ C^a</bdi>، حيث <bdi dir="ltr">a = {{run.metrics.a_measured}}</bdi>.
        نشر <bdi dir="ltr">Kaplan</bdi> القيمة 0.73، ونشرت <bdi dir="ltr">Chinchilla</bdi> القيمة 0.50.
        قيمتك أقرب إلى قيمة <bdi dir="ltr">Kaplan</bdi>.
        ومعنى ذلك عملياً: حين تتضاعف الميزانية، يذهب معظم الزيادة إلى المعاملات.


        التوفيق الثاني يُظهر الوجه الآخر للحقيقة نفسها.
        عدد الرموز في أفضل تشغيل يكاد لا يتحرّك: <bdi dir="ltr">D_opt ∝ C^b</bdi>، حيث <bdi dir="ltr">b = {{run.metrics.b_measured}}</bdi>.
        فهو يرتفع من {{run.metrics.tokens_first_m}} مليون رمز عند أصغر ميزانية إلى {{run.metrics.tokens_last_m}} مليون عند أكبرها، مع أنّ الحوسبة تتضاعف عدّة مرات.
        وعند هذه الميزانيات، بضعة ملايين من الرموز تعني بضعة آلاف من خطوات التحسين.
        يبدو أنّ التشغيل يحتاج إلى نحو هذا العدد من الخطوات قبل أن يُفيده حجمه.
        فإذا حصل عليها، صار إنفاق الحوسبة الإضافية على المعاملات أجدى.


        إذن عدد الرموز لكل معامل ليس ثابتاً هنا.
        عند أفضل تقسيم، ينخفض هذا العدد من {{run.metrics.ratio_first}} عند أصغر ميزانية إلى {{run.metrics.ratio_last}} عند أكبرها.
        أما رقم الـ20 في <bdi dir="ltr">Chinchilla</bdi> فكان قياساً لنماذجهم ومُرمِّزهم وبياناتهم، عند ميزانيات أكبر من ميزانياتنا بمراتب كثيرة.
        لا ينتقل ذلك الرقم إلى إعدادنا، ولا تنتقل أرقامنا إلى إعدادهم.
        ومن أسباب الفرق وحدة القياس نفسها.
        فالبايت يحمل معلومات أقلّ بكثير من رمز المُرمِّز، الذي يغطّي عادةً عدّة أحرف.


        التوفيق الثالث هو حدّ الخسارة: <bdi dir="ltr">L_opt(C) = E + A·C^(−α)</bdi>.
        وهو يُظهر <Term en="Diminishing Returns">تناقص العوائد</Term>.
        فكل مضاعفة للحوسبة تُزيل من الخسارة أقلّ مما أزالته المضاعفة التي قبلها.
        وفي هذا الحدّ أرضية: <bdi dir="ltr">E = {{run.metrics.E_frontier}}</bdi> نات لكل بايت.
        هذه الأرضية هي المستوى الذي تقترب منه هذه العائلة من النماذج ولا تتجاوزه، مهما كبرت الميزانية.
        وهي <Term en="Irreducible Loss">الخسارة غير القابلة للاختزال</Term>، كما تراها هذه النقاط القليلة.

  # ── Predict ─────────────────────────────────────────────────────────────
  - type: prose
    title: { en: "Commit before training", ar: "التزم قبل التدريب" }
    phase: { en: "Predict", ar: "التوقّع" }
    text:
      en: >-
        A law that only describes the points it was fitted to is
        <Term en="Interpolation (Statistical)">interpolation</Term>. The
        reason to fit one is
        <Term en="Extrapolation (Statistical)">extrapolation</Term>: choosing
        a model at a budget you have not tried yet. So the next cell commits,
        in writing, to a model size and a loss for a budget
        {{scale.holdout_factor}}× larger than any fitted point. Only then
        does the following cell train anything at that budget.
      ar: >-
        القانون الذي لا يصف إلا النقاط التي وُفِّق عليها هو مجرّد <Term en="Interpolation (Statistical)">استيفاء</Term>.
        أما سبب توفيقه أصلاً فهو <Term en="Extrapolation (Statistical)">الاستقراء الخارجي</Term>،
        أي اختيار نموذج عند ميزانية لم تجرّبها بعد.
        لذلك تلتزم الخلية التالية، كتابةً، بحجم نموذج وبقيمة خسارة،
        لميزانية أكبر بـ{{scale.holdout_factor}} مرات من أيّ نقطة في التوفيق.
        وبعدها فقط تبدأ الخلية التي تليها التدريب عند تلك الميزانية.

  - type: cell
    id: predict
    ref: predict
    captures: [predicted_size_k, predicted_loss, committed_params, committed_tokens_m]
    title: { en: "Predict the held-out budget", ar: "توقّع الميزانية المحجوزة" }
    phase: { en: "Predict", ar: "التوقّع" }
    caption:
      en: "Nothing trains here. Note the two predicted numbers before you run the next cell."
      ar: "لا تدريب في هذه الخلية. سجّل الرقمين المتوقَّعين قبل أن تشغّل الخلية التالية."

  - type: cell
    id: holdout
    ref: holdout
    captures: [committed_loss, best_holdout_loss, measured_size_k, holdout_ratio, size_regret, size_ratio, signed_error_pct, prediction_error_pct, holdout_minutes, peak_vram_gb]
    title: { en: "Measure the held-out valley", ar: "قِس وادي الميزانية المحجوزة" }
    phase: { en: "Predict", ar: "التوقّع" }
    caption:
      en: "The left panel is the new budget's own valley. The two straight blue lines are the numbers you committed to. See how close the valley's bottom comes to each."
      ar: "اللوحة اليسرى هي وادي الميزانية الجديدة نفسها. والخطّان الأزرقان المستقيمان هما الرقمان اللذان التزمتَ بهما. انظر كم يقترب قاع الوادي من كلٍّ منهما."

  - type: prose
    title: { en: "Score the two predictions", ar: "قيّم التوقّعين" }
    phase: { en: "Predict", ar: "التوقّع" }
    text:
      en: >-
        Start with the size. The fit predicted a best size near
        {{run.metrics.predicted_size_k}}k parameters. The held-out valley's
        own bottom is near {{run.metrics.measured_size_k}}k, so the prediction
        was {{run.metrics.size_ratio}} times the measured optimum. The model
        we committed to scored {{run.metrics.committed_loss}}, and the best
        model trained at this budget scored {{run.metrics.best_holdout_loss}}.
        The gap between them, {{run.metrics.size_regret}} nats per byte, is
        what our choice of size cost.


        Look at the left panel to see why that cost stays small. The valley is
        wide and nearly flat near its bottom, so a size that is somewhat off
        loses very little. This is also why a rule of thumb for the ratio can
        be useful even when it is not exact.


        Now the loss. The fit predicted {{run.metrics.predicted_loss}} nats
        per byte, and the best measured loss is
        {{run.metrics.best_holdout_loss}}: an error of
        {{run.metrics.signed_error_pct}}%. A negative sign means the
        prediction was optimistic.


        This is the same reasoning that sized Chinchilla before it was
        trained, only at a much smaller scale. Train small models, find the
        bottom of each valley, fit the frontier, extrapolate, and then check
        the extrapolation against a budget you did not fit.
      ar: >-
        نبدأ بالحجم.
        توقّع التوفيق أن يكون أفضل حجم قرب {{run.metrics.predicted_size_k}} ألف معامل.
        أما قاع وادي الميزانية المحجوزة فيقع قرب {{run.metrics.measured_size_k}} ألف.
        أي أنّ الحجم المتوقَّع يساوي الحجم الأمثل المقيس مضروباً في {{run.metrics.size_ratio}}.
        النموذج الذي التزمنا به سجّل خسارة {{run.metrics.committed_loss}}.
        وأفضل نموذج درّبناه عند هذه الميزانية سجّل {{run.metrics.best_holdout_loss}}.
        الفرق بينهما هو {{run.metrics.size_regret}} نات لكل بايت، وهذه هي كلفة اختيارنا للحجم.


        انظر إلى اللوحة اليسرى لترى لماذا تبقى هذه الكلفة صغيرة.
        الوادي عريض، ويكاد يكون مستوياً قرب قاعه.
        لذلك لا يخسر الحجم المنحرف قليلاً عن الأمثل إلا القليل.
        ولهذا السبب نفسه تنفع القواعد التقريبية للنسبة، حتى حين لا تكون دقيقة.


        ننتقل إلى الخسارة.
        توقّع التوفيق {{run.metrics.predicted_loss}} نات لكل بايت.
        وأفضل خسارة مقيسة هي {{run.metrics.best_holdout_loss}}، أي أنّ الخطأ <bdi dir="ltr">{{run.metrics.signed_error_pct}}%</bdi>.
        والإشارة السالبة تعني أنّ التوقّع كان متفائلاً.


        هذا هو المنطق نفسه الذي حُدّد به حجم <bdi dir="ltr">Chinchilla</bdi> قبل تدريبها، لكن على مقياس أصغر بكثير.
        تدرّب نماذج صغيرة، ثم تجد قاع كل وادٍ، ثم توفّق الحدّ الأمثل، ثم تستقرئ خارجه.
        وفي النهاية تفحص هذا الاستقراء عند ميزانية لم تدخل في التوفيق.

  # ── Stress-test ─────────────────────────────────────────────────────────
  - type: prose
    title: { en: "Fit a second way", ar: "وفّق بطريقة ثانية" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    text:
      en: >-
        Chinchilla's Approach 3 uses every run at once instead of only the
        stars. It fits one surface, L(N, D) = E + A/N^α + B/D^β, and reads the
        allocation exponent off it as a = β / (α + β). If both methods describe
        the same reality, they should roughly agree. In the paper they did:
        0.49 from the IsoFLOP method and 0.46 from the surface. The surface
        also makes its own prediction for the held-out budget, so we can score
        it the same way.
      ar: >-
        الطريقة الثالثة في <bdi dir="ltr">Chinchilla</bdi> تستخدم كل التشغيلات معاً، لا النجوم وحدها.
        فهي توفّق سطحاً واحداً: <bdi dir="ltr">L(N, D) = E + A/N^α + B/D^β</bdi>.
        ثم تقرأ منه أُسّ التوزيع: <bdi dir="ltr">a = β / (α + β)</bdi>.
        إذا كانت الطريقتان تصفان الواقع نفسه، فيجب أن تتقاربا.
        وفي الورقة تقاربتا فعلاً: 0.49 بطريقة الحوسبة الثابتة، و0.46 من السطح.
        والسطح يعطي أيضاً توقّعه الخاص للميزانية المحجوزة.
        لذلك نستطيع أن نقيّمه بالطريقة نفسها.

  - type: cell
    id: parametric
    ref: parametric
    captures: [param_exponent_a, param_E, surface_size_k, surface_pred, surface_error_pct]
    title: { en: "Fit the loss surface", ar: "وفّق سطح الخسارة" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    caption:
      en: "Compare the two exponents, then the two predictions for the held-out budget."
      ar: "قارن الأُسّين أولاً، ثم قارن توقّعَي الطريقتين للميزانية المحجوزة."

  - type: prose
    title: { en: "Weigh the two methods", ar: "وازن بين الطريقتين" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    text:
      en: >-
        The surface gives a = {{run.metrics.param_exponent_a}} and a floor E =
        {{run.metrics.param_E}}. The IsoFLOP method gave a =
        {{run.metrics.a_measured}} and E = {{run.metrics.E_frontier}}. For the
        held-out budget, the surface predicted a best size of
        {{run.metrics.surface_size_k}}k parameters and a loss of
        {{run.metrics.surface_pred}}, an error of
        {{run.metrics.surface_error_pct}}%.


        The two methods read the same runs, so a gap between them cannot be
        noise in the training. It comes from what each one assumes. The
        surface assumes one formula holds for every run, including the runs on
        the steep right wall of each valley. The IsoFLOP method looks only at
        the three runs around each bottom, and assumes nothing about the rest.


        Here the two agree on the main points. Both give an exponent well
        above 0.5. Both put the floor at a similar level. And both predict a
        loss for the held-out budget that is close to the measured one. When
        two methods with different assumptions reach the same answer, that
        answer deserves more trust than either fit alone.
      ar: >-
        يعطي السطح <bdi dir="ltr">a = {{run.metrics.param_exponent_a}}</bdi> وأرضيةً <bdi dir="ltr">E = {{run.metrics.param_E}}</bdi>.
        وأعطت طريقة الحوسبة الثابتة <bdi dir="ltr">a = {{run.metrics.a_measured}}</bdi> و<bdi dir="ltr">E = {{run.metrics.E_frontier}}</bdi>.
        وللميزانية المحجوزة، توقّع السطح أن يكون أفضل حجم {{run.metrics.surface_size_k}} ألف معامل، وأن تكون الخسارة {{run.metrics.surface_pred}}.
        أي أنّ خطأه <bdi dir="ltr">{{run.metrics.surface_error_pct}}%</bdi>.


        الطريقتان تقرآن التشغيلات نفسها.
        لذلك لا يمكن أن يكون الفرق بينهما ضجيجاً في التدريب.
        مصدر الفرق هو ما تفترضه كل طريقة.
        السطح يفترض أنّ صيغة واحدة تصحّ في كل التشغيلات، ومنها التشغيلات الواقعة على الجدار الأيمن الحادّ لكل وادٍ.
        أما طريقة الحوسبة الثابتة فتنظر فقط إلى التشغيلات الثلاثة المحيطة بكل قاع، ولا تفترض شيئاً عن البقية.


        وهنا تتّفق الطريقتان في النقاط الأساسية.
        كلتاهما تعطي أُسّاً أعلى بوضوح من 0.5.
        وكلتاهما تضع الأرضية عند مستوى متقارب.
        وكلتاهما تتوقّع للميزانية المحجوزة خسارة قريبة من المقيسة.
        وحين تصل طريقتان مختلفتا الافتراضات إلى الجواب نفسه، يستحقّ هذا الجواب ثقة أكبر مما يستحقّه أيّ توفيق منفرد.

  - type: exercise
    id: guess-the-floor
    ref: exercise_floor
    captures: [floor_pred, floor_error_pct, in_range_error_pct]
    title: { en: "Set the floor by hand", ar: "ثبّت الأرضية يدوياً" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    prompt:
      en: >-
        No model predicts text perfectly, so the real frontier has a floor:
        the <Term en="Irreducible Loss">irreducible loss</Term>. The fit had
        to estimate that floor from a handful of points. This cell fixes the
        floor by hand and refits the rest. It starts at zero, which is a pure
        power law that keeps falling forever. Before you run it, predict: will
        it place the held-out loss higher or lower than the fit with a floor
        did? Then raise E_FLOOR in steps. Watch two numbers: how well the
        curve still fits the points it was fitted to, and how close it lands
        at the held-out budget.
      ar: >-
        لا يوجد نموذج يتوقّع النص توقّعاً تامّاً.
        لذلك للحدّ الحقيقي أرضية، وهي <Term en="Irreducible Loss">الخسارة غير القابلة للاختزال</Term>.
        وقد اضطُرّ التوفيق إلى تقدير هذه الأرضية من بضع نقاط فقط.
        هذه الخلية تثبّت الأرضية يدوياً، ثم تعيد توفيق بقية المنحنى.
        وهي تبدأ من الصفر، أي من قانون قوة خالص يستمرّ في الهبوط بلا نهاية.
        قبل أن تشغّلها، توقّع: هل سيضع هذا القانون خسارة الميزانية المحجوزة أعلى أم أدنى مما وضعها التوفيق ذو الأرضية؟
        بعد ذلك ارفع <bdi dir="ltr">E_FLOOR</bdi> على خطوات.
        وراقب رقمين: مدى مطابقة المنحنى لنقاط التوفيق، ومدى قربه من القياس عند الميزانية المحجوزة.
    hint: 1

  - type: exercise
    id: count-like-kaplan
    ref: exercise_count
    captures: [count_exponent_a, count_ratio_last]
    title: { en: "Count parameters like Kaplan", ar: "عُدّ المعاملات كما عدّها <bdi dir=\"ltr\">Kaplan</bdi>" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    prompt:
      en: >-
        This cell refits the frontier using the non-embedding parameter count.
        Nothing is retrained; only the number written next to each model
        changes. Before you run it, guess whether the exponent a goes up or
        down. Then compare it with Kaplan's reported 0.73 and Chinchilla's
        0.50.
      ar: >-
        تعيد هذه الخلية توفيق الحدّ الأمثل باستخدام عدد المعاملات دون جداول التضمين.
        لا يُعاد تدريب أيّ شيء، والذي يتغيّر هو الرقم المكتوب بجانب كل نموذج فقط.
        قبل أن تشغّلها، خمّن: هل يرتفع الأُسّ <bdi dir="ltr">a</bdi> أم ينخفض؟
        ثم قارنه بالقيمة التي نشرها <bdi dir="ltr">Kaplan</bdi>، أي 0.73، وبقيمة <bdi dir="ltr">Chinchilla</bdi>، أي 0.50.
    hint: 2

  - type: prose
    title: { en: "Weigh the two refits", ar: "قدّر أثر إعادتَي التوفيق" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    text:
      en: >-
        Both exercises refit the same runs, and both change the answer.


        Without a floor, the prediction for the held-out budget is off by
        {{run.metrics.floor_error_pct}}%, against
        {{run.metrics.signed_error_pct}}% with the fitted floor. Yet on the
        points it was fitted to, the pure power law is never off by more than
        {{run.metrics.in_range_error_pct}}%. Inside the fitted range the two
        curves are hard to tell apart. At a budget {{scale.holdout_factor}}×
        further out, they are not. A fit can only be judged by a test outside
        its range.


        Counting parameters like Kaplan moves the exponent from
        {{run.metrics.a_measured}} to {{run.metrics.count_exponent_a}}, with
        no retraining. The direction makes sense. Embedding tables are a
        larger share of a small model than of a large one, so removing them
        shrinks the small models most, and size then appears to grow faster
        with compute. A later analysis attributes much of the gap between the
        two papers to this: the earlier law counted non-embedding parameters,
        at model sizes where embeddings are a large share.
      ar: >-
        كلا التمرينين يعيد التوفيق على التشغيلات نفسها، وكلاهما يغيّر الجواب.


        دون أرضية، يخطئ التوقّع للميزانية المحجوزة بمقدار <bdi dir="ltr">{{run.metrics.floor_error_pct}}%</bdi>.
        أما مع الأرضية المُوفَّقة فكان الخطأ <bdi dir="ltr">{{run.metrics.signed_error_pct}}%</bdi>.
        ومع ذلك، لا يتجاوز خطأ قانون القوة الخالص <bdi dir="ltr">{{run.metrics.in_range_error_pct}}%</bdi> على النقاط التي وُفِّق عليها.
        معنى ذلك أنّ المنحنيين يكادان يتطابقان داخل مدى التوفيق.
        لكنهما يفترقان بوضوح عند ميزانية أبعد بـ{{scale.holdout_factor}} مرات.
        فلا يُحكَم على التوفيق إلا باختبار خارج مداه.


        أما عدّ المعاملات على طريقة <bdi dir="ltr">Kaplan</bdi> فينقل الأُسّ من {{run.metrics.a_measured}} إلى {{run.metrics.count_exponent_a}}، دون أيّ إعادة تدريب.
        واتجاه هذا التغيّر مفهوم.
        جداول التضمين تشكّل من النموذج الصغير حصّة أكبر مما تشكّله من النموذج الكبير.
        لذلك يُصغّر حذفُها النماذجَ الصغيرة أكثر من غيرها.
        فيبدو الحجم كأنه ينمو مع الحوسبة أسرع مما ينمو فعلاً.
        وقد أرجع تحليل لاحق جزءاً كبيراً من الفرق بين الورقتين إلى هذا بالذات.
        فالقانون الأقدم عدّ المعاملات دون جداول التضمين، وعند أحجام تشكّل فيها هذه الجداول حصّة كبيرة.

  - type: exercise
    id: handicap-the-short-runs
    ref: exercise_handicap
    captures: [fair_size_k, handicap_size_k, fair_ratio, handicap_ratio, handicap_cost]
    title: { en: "Handicap the short runs", ar: "أعِق التشغيلات القصيرة" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    prompt:
      en: >-
        PyTorch's default embedding initialisation is much larger than ours.
        Because the token table is also the output layer, the default starts
        every run with confident, wrong predictions, and the first steps go to
        undoing them. This cell re-measures the smallest budget's valley with
        that default, using the same models and the same seeds. Before you run
        it, predict which way the best size moves. The cell trains a few more
        models, so it takes a minute or two.
      ar: >-
        التهيئة الافتراضية لجدول التضمين في <bdi dir="ltr">PyTorch</bdi> أكبر بكثير من تهيئتنا.
        وجدول الرموز عندنا هو نفسه طبقة المخرج.
        لذلك تجعل التهيئة الافتراضية كل تشغيل يبدأ بتوقّعات واثقة وخاطئة، فتذهب خطواته الأولى في التراجع عنها.
        تعيد هذه الخلية قياس وادي أصغر ميزانية بتلك التهيئة، مع النماذج نفسها والبذور نفسها.
        قبل أن تشغّلها، توقّع: في أيّ اتجاه سيتحرّك أفضل حجم؟
        تدرّب الخلية بضعة نماذج إضافية، فتحتاج إلى دقيقة أو دقيقتين.
    hint: 3

  - type: prose
    title: { en: "Connect it to the two papers", ar: "اربط ذلك بالورقتين" }
    phase: { en: "Stress-test", ar: "اختبار الصمود" }
    text:
      en: >-
        With the default initialisation, the best size at the smallest budget
        moved from {{run.metrics.fair_size_k}}k to
        {{run.metrics.handicap_size_k}}k parameters, and the best loss rose by
        {{run.metrics.handicap_cost}} nats per byte. Nothing about the models
        or the data changed.


        The handicap is the same for every run: some steps wasted at the
        start. But a short run loses a larger share of its training to it than
        a long one does. At a fixed budget, the short runs are the large
        models. So the large models suffer most, and the bottom of the valley
        slides toward smaller ones.


        This is the kind of detail that separates the two papers. The
        Chinchilla authors argue that the earlier setup made training on fewer
        tokens look worse than it was, and that this bias shaped the earlier
        law. A <Term en="Scaling Law">scaling law</Term> is a property of a
        whole measurement setup: the models, the data, the tokenizer, the
        optimizer, the initialisation and the bookkeeping. Change one of them
        and you should measure again.
      ar: >-
        مع التهيئة الافتراضية، انتقل أفضل حجم عند أصغر ميزانية من {{run.metrics.fair_size_k}} ألف معامل إلى {{run.metrics.handicap_size_k}} ألف.
        وارتفعت أفضل خسارة بمقدار {{run.metrics.handicap_cost}} نات لكل بايت.
        ولم يتغيّر شيء في النماذج ولا في البيانات.


        الإعاقة واحدة في كل التشغيلات: عدد من الخطوات يضيع في البداية.
        لكنّ التشغيل القصير يخسر بسببها حصّة من تدريبه أكبر مما يخسره التشغيل الطويل.
        وعند ميزانية ثابتة، التشغيلات القصيرة هي تشغيلات النماذج الكبيرة.
        لذلك تتضرّر النماذج الكبيرة أكثر من غيرها، فينزلق قاع الوادي نحو النماذج الأصغر.


        تفصيل من هذا النوع هو ما يفصل بين الورقتين.
        يرى مؤلفو <bdi dir="ltr">Chinchilla</bdi> أنّ الإعداد الأقدم جعل التدريب على رموز أقلّ يبدو أسوأ من حقيقته.
        ويرون أنّ هذا الانحياز أثّر في القانون الأقدم.
        ما نستخلصه أنّ <Term en="Scaling Law">قانون التوسّع</Term> خاصيةٌ لإعداد القياس كله:
        النماذج، والبيانات، والمُرمِّز، والمُحسِّن، والتهيئة، وطريقة العدّ.
        فإذا غيّرت واحداً منها، فعليك أن تقيس من جديد.

