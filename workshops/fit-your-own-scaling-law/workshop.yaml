  - type: prose
    title: { en: "Keep the method", ar: "احتفظ بالطريقة" }
    phase: { en: "Verify", ar: "التحقّق" }
    text:
      en: >-
        What should stay with you is the procedure rather than any one
        exponent. Fix the compute, vary the split, find the bottom of each
        valley, fit a line through the bottoms, and test the line on a budget
        you did not fit. The same procedure was used to plan models with
        billions of parameters.


        On this setup it gave N ∝ C^{{run.metrics.a_measured}}, and
        {{run.metrics.holdout_ratio}} bytes per parameter at the held-out
        budget. Chinchilla found 0.50, and 20 tokens per parameter. Neither
        pair of numbers is wrong. Each is what a measured law looks like for
        one setup, and the measurement is something you can now repeat
        yourself.
      ar: >-
        ما يجب أن يبقى معك هو الإجراء، لا أُسٌّ بعينه.
        ثبّت الحوسبة، ونوّع التقسيم، وجِد قاع كل وادٍ.
        ثم مرّر خطاً عبر القيعان، واختبره عند ميزانية لم تدخل في التوفيق.
        بهذا الإجراء نفسه خُطّط لنماذج فيها مليارات المعاملات.


        في هذا الإعداد أعطى الإجراء <bdi dir="ltr">N ∝ C^{{run.metrics.a_measured}}</bdi>، و{{run.metrics.holdout_ratio}} بايتاً لكل معامل عند الميزانية المحجوزة.
        أما <bdi dir="ltr">Chinchilla</bdi> فوجدت 0.50، و20 رمزاً لكل معامل.
        لا خطأ في أيٍّ من الزوجين.
        كلٌّ منهما هو ما يبدو عليه قانون مقيس في إعداد بعينه.
        وهذا القياس صار شيئاً تستطيع أن تكرّره بنفسك.
