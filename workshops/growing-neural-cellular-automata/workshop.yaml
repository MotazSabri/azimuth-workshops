schema: workshop/v1
id: growing-neural-cellular-automata
constellation: neural-networks

title:
  en: "Growing neural cellular automata: the target is a waypoint, not a fixed point"
  ar: "أوتوماتا خلوية عصبية تنمو: الهدف محطة عبور لا نقطة استقرار"

concept:
  en: "Persistence is bought by which states you train from, not by what the loss asks for"
  ar: "الثبات تشتريه بالحالات التي تدرّب منها، لا بما تطلبه دالة الخسارة"

scenario:
  en: >-
    A single cell sits at the centre of an empty grid. One small convolutional
    rule — a few thousand parameters, shared by every cell, seeing nothing but
    its own channels and a three-by-three neighbourhood — is applied to the
    whole grid, over and over. Nothing is told where the edges of the shape
    should be. Nothing counts steps. Nothing holds a plan. After a few dozen
    applications there is a flower.


    That much is the paper's result, and reading it is enough to learn it. What
    reading does not tell you is what happens on step one hundred. Train the
    obvious way — start from the seed, run the rule for a few dozen steps, ask
    the output to look like the target — and you get a rule that arrives at the
    flower and then keeps going, because nothing in that objective ever
    mentioned staying. The target was a waypoint the trajectory passed
    through, not an attractor it settles at.


    This workshop trains two rules that differ in exactly one respect: which
    states each training batch starts from. Same architecture, same initial
    weights, same optimizer, same budget, same loss, character for character.
    One starts every batch from the seed. The other starts from states it
    produced earlier, some of which have had a hole punched in them. At the
    horizon they were trained through, the seed-only rule is the better of the
    two: lower loss, and a closer match to the flower. Four times further out
    it has slid to a match of {{run.metrics.naive_match_long}} while the other
    still holds {{run.metrics.pool_match_long}} — and only one of them, cut in
    half, comes back.
  ar: >-
    <Term en="Grid Cell">خلية</Term> واحدة في مركز شبكة فارغة. وقاعدة
    <Term en="Convolution">التفافية</Term> صغيرة لا تتجاوز بضعة آلاف من
    المعاملات، تشترك فيها كل الخلايا، ولا ترى من العالم سوى قنواتها الذاتية
    و<Term en="Local Receptive Field">مجالٍ استقبالي محلي</Term> بمقاس ثلاثة في
    ثلاثة، تُطبَّق على الشبكة كلها مرّة بعد مرّة. لا أحد يخبر النظام أين تنتهي
    حواف الشكل، ولا شيء يعدّ الخطوات، ولا خطة مركزية في أي موضع. وبعد بضع
    عشرات من التطبيقات تظهر زهرة.


    هذا القدر نتيجةُ الورقة البحثية، وقراءتها تكفي لمعرفته. لكن القراءة لا
    تخبرك بما يحدث عند الخطوة المئة. درّب بالطريقة البديهية — ابدأ من البذرة،
    شغّل القاعدة بضع عشرات من الخطوات، ثم اطلب أن يشبه الناتج الهدف — تحصل على
    قاعدة تبلغ الزهرة ثم تمضي متجاوزةً إياها، لأن ذلك الهدف التدريبي لم يذكر
    البقاء أصلاً. كانت الزهرة محطة عبرها المسار، لا
    <Term en="Attractor">جاذباً</Term> يستقرّ عنده.


    تدرّب هذه الورشة قاعدتين لا تختلفان إلا في أمر واحد: الحالات التي تبدأ
    منها كل دفعة تدريب. البنية واحدة، والأوزان الابتدائية واحدة، والمحسِّن
    واحد، والميزانية واحدة، ودالة الخسارة واحدة حرفاً بحرف. تبدأ إحداهما كل
    دفعة من البذرة، وتبدأ الأخرى من حالات أنتجتها هي نفسها في خطوات سابقة،
    وقد ثُقب في بعضها ثقب. وعند الأفق الذي دُرِّبتا عبره تكون قاعدة البذرة هي
    الأفضل: خسارتها أدنى، ومطابقتها للزهرة أقرب. أما عند أربعة أضعاف ذلك المدى
    فقد انحدرت إلى تطابق مقداره {{run.metrics.naive_match_long}} بينما لا تزال
    الأخرى تحفظ {{run.metrics.pool_match_long}}، ولا تعود من القطع نصفين إلا
    واحدة.

goal:
  en: >-
    Train both rules, watch the flower grow from one cell, then measure three
    things the loss never asked for: how well each rule matches the target far
    past the horizon it was trained through, the gap between them there, and
    how much of the target a grown flower recovers after half the grid is
    erased.
  ar: >-
    درّب القاعدتين، وشاهد الزهرة تنمو من خلية واحدة، ثم قِس ثلاثة أشياء لم
    تطلبها دالة الخسارة قط: مدى مطابقة كل قاعدة للهدف بعد الأفق المدرَّب
    بكثير، والفارق بينهما عند ذلك المدى، وكم تستعيد زهرة مكتملة من هدفها بعد
    محو نصف الشبكة.

difficulty: intermediate
status: draft
publishedAt: null

maintenance:
  # stable: torch, numpy, matplotlib and the standard library. The target is
  # drawn procedurally rather than downloaded, so there is no asset to pin, no
  # licence to track and no URL that can start returning a login page.
  tier: stable
  cadence: quarterly

estimate:
  # MEASURED on a Colab free-tier T4: train_seconds 189 for both rules at the
  # scale below, elapsedSec 807 end to end including the growth, persistence
  # and damage rollouts. Rounded up a little for reading time.
  gpuMinutes: 4
  totalMinutes: 15

papers:
  # Only the slug the workshop was commissioned with is declared. The papers
  # corpus (`content/papers/`) is not part of the repository this was authored
  # against, so no slug here could be verified — and a guessed slug fails as a
  # silent warning at content build rather than as an error, which is the
  # worst way for it to fail. Candidates worth adding once their real slugs
  # can be confirmed: the residual-network paper (the update is a residual),
  # the batch-normalization-era work on training through long unrolled
  # computations, and anything in the corpus on self-organization or Turing
  # morphogenesis.
  - slug: growing-neural-cellular-automata
    role: core
    label:
      en: "a differentiable update rule trained through its own iteration, growing and regenerating a target pattern from a single cell — Mordvintsev et al., 2020"
      ar: "قاعدة تحديث قابلة للاشتقاق تُدرَّب عبر تكرارها الذاتي فتنمّي نمطاً هدفاً من خلية واحدة وتعيد ترميمه — Mordvintsev et al., 2020"

assets: []

profiles:
  - id: free
    default: true
    name:
      en: "Free tier (Colab T4)"
      ar: "المستوى المجاني (Colab T4)"
    requires:
      # TRUE, and changed from an earlier false after measurement. Colab's
      # free tier includes a T4, so this is still the free profile — the
      # dishonest part was the flag, not the name. Training both rules to the
      # point where a flower actually forms takes 189s on that T4; the same
      # work on one CPU core projects to over twenty minutes, and a shorter
      # CPU budget was measured and produces an unrecognisable red blob.
      # Shipping the blob to keep `gpu: false` would have been the worse lie.
      gpu: true
      # PROVISIONAL, still not measured — `peak_vram_mb` is now printed by the
      # train cell, so the next run settles this. One gigabyte is a generous
      # ceiling for 4,704 parameters and a batch of five 28-square grids
      # unrolled a few dozen steps. Deliberately not a card's capacity.
      vramGb: 1
      ramGb: 2
    scale:
      # Large enough that the six petals stay distinct and the leaf is a
      # recognisable object rather than three pixels — the damage panel is the
      # point of the workshop and it has to be legible. Smaller was tried and
      # the petals blur together.
      grid: 28
      # 12, not the paper's 16. Four are RGBA and the remaining eight are the
      # rule's own scratch space, which is where anything resembling
      # coordination between neighbours has to live.
      channels: 12
      hidden: 96
      batch: 5
      poolSize: 128
      # The rollout length is sampled in this range every training step, so
      # the rule never learns to count. The floor is set by geometry: a signal
      # leaving the centre cell moves at most one cell per step, so it needs
      # roughly half the grid width to reach a corner at all.
      minSteps: 32
      maxSteps: 44
      # MEASURED, and this number was wrong twice. At 600 steps both rules
      # reach a red blob with no petals, no centre and no stem: the metrics
      # were fine and the picture was worthless. At 3000 the flower forms
      # properly and the seed-only rule reaches a match of 0.99.
      trainSteps: 3000
      learningRate: 0.002
      # Each cell updates independently with this probability. At 1.0 the grid
      # steps in lockstep, which is a global clock, which is precisely the
      # coordination the model is supposed to manage without.
      fireRate: 0.5
      aliveThreshold: 0.1
      damageRadius: 0.18
      damagePerBatch: 2
      # 96, not 48. At 48 the pool rule is caught in a local dip in its own
      # match curve — it scored 0.71 there and 0.81 fifty steps later — so the
      # "grown" panel was showing a flower that had not settled, and the
      # exercise could heal to a BETTER score than its own undamaged
      # reference, which reads as a bug and is not one.
      growSteps: 96
      # Four times the longest rollout either rule was ever trained through.
      # Far enough out that a rule which has not learned to stay has visibly
      # stopped being a flower.
      persistSteps: 200
      # MUST TRACK growSteps. This was left at 48 while growSteps doubled, and
      # the result was a healed panel that only recovered to 0.67 from 0.89 —
      # the rule was being asked to rebuild half a flower in half the time it
      # takes to build a whole one. Hint 4 warns the reader about exactly this
      # mistake, which is a poor look when the profile is making it.
      healSteps: 96
      # 250, not 50. At 3000 training steps a fifty-step interval prints 120
      # log lines, and the capture step merges consecutive streams into one
      # block — so the published page carried a wall of numbers nobody reads.
      logEvery: 250
      stripFrames: 8
      seed: 17

  - id: paper
    name:
      en: "Closer to the paper (GPU)"
      ar: "أقرب للورقة البحثية (GPU)"
    requires:
      gpu: true
      # PROVISIONAL — not measured. Report what the run actually allocates
      # with torch.cuda.max_memory_allocated() and declare that, never the
      # capacity of whichever card happened to be attached.
      vramGb: 2
      ramGb: 4
    scale:
      grid: 40
      channels: 16
      hidden: 128
      batch: 8
      poolSize: 512
      minSteps: 64
      maxSteps: 96
      # UNMEASURED. Nothing has been run at this size; the free profile is the
      # one with any reasoning behind it at all.
      trainSteps: 4000
      learningRate: 0.002
      fireRate: 0.5
      aliveThreshold: 0.1
      damageRadius: 0.18
      damagePerBatch: 3
      # Already paired correctly, which is how the free profile's mismatch was
      # spotted: the two profiles disagreed about whether healing gets the
      # same budget as growing, and only one of them can be right.
      growSteps: 96
      persistSteps: 400
      healSteps: 96
      logEvery: 200
      stripFrames: 8
      seed: 17

checks:
  # Three of these are now set from a measured run on a Colab T4 at the scale
  # in the default profile. `recovers` is still a placeholder and is marked as
  # such — `healSteps` changed after that run, so its value is known to be
  # stale and the next execution settles it.
  #
  # The scores these read are not raw losses. A raw pixel error is a bad bar
  # here because the target is mostly transparent background, so a rule that
  # dies on step two scores well on it. Every score below is instead the error
  # divided by the error an EMPTY GRID makes, subtracted from one: zero is
  # exactly "no better than nothing", one is perfect, and negative is worse
  # than having never grown at all. That makes a minimum the right direction
  # and makes a vacuous run fail rather than pass.
  - id: naive-grows
    required: true
    # Measured 0.988. Set well below, because this is the control and it
    # should only fail when the run genuinely did not train. The comparison is
    # "the seed-only rule arrives and then leaves" — a rule that never arrived
    # never left, and the other three numbers would then be about two rules
    # that both failed. Raise trainSteps if this fails; do not lower this.
    min: 0.85
    label:
      en: "Seed-only rule's match to the target at the horizon it was trained through"
      ar: "تطابق قاعدة البذرة مع الهدف عند الأفق الذي دُرِّبت عبره"
  - id: target-match
    required: true
    # Measured 0.891. The pool rule is expected to sit BELOW the seed-only
    # rule here — that gap is the fidelity tax it pays for persisting — so
    # this floor is set lower than `naive-grows` on purpose, not by oversight.
    min: 0.75
    label:
      en: "Pool-trained rule's match to the target, grown from a single cell"
      ar: "تطابق القاعدة المدرَّبة بالمجمّع مع الهدف بعد نموّها من خلية واحدة"
  - id: persists
    required: true
    # Measured 0.863, and read from the pool rule's own match rather than from
    # its lead over the seed-only rule. Across two runs that lead moved from
    # 8.45 to 0.63 while this number moved from 0.814 to 0.863: the lead is
    # largely a measure of how badly the loser fails on a given seed, and a
    # threshold on it would be a threshold on someone else's failure. This
    # number is bounded, means one thing, and a dead grid still scores zero.
    min: 0.7
    label:
      en: "Pool-trained rule's match to the target, far past the horizon it was trained through"
      ar: "تطابق القاعدة المدرَّبة بالمجمّع مع الهدف بعد الأفق الذي دُرِّبت عبره بكثير"
  - id: recovers
    required: true
    # PLACEHOLDER, DELIBERATELY STALE. The last run measured 0.237, but it ran
    # with healSteps at half of growSteps, which is the defect fixed above.
    # Setting a bar from that run would freeze the mistake into the threshold.
    # A difference — match after healing minus match immediately after the cut
    # — and not the healed match alone, because a shallow wound leaves a high
    # absolute match without any healing having happened.
    min: 0.2
    label:
      en: "Match regained after half the grid is erased"
      ar: "التطابق المستعاد بعد محو نصف الشبكة"

hints:
  - en: >-
      Read the match scores against the right zero. The target is mostly empty
      background, so a rule that dies immediately gets most of the pixels
      right, and a plain pixel error would call that a decent result. Every
      score here is divided by the error an empty grid makes, which pins doing
      nothing at exactly zero — so a negative score is not a bug, it is a rule
      that has filled the grid with something worse than nothing.
    ar: >-
      اقرأ درجات التطابق مقابل الصفر الصحيح. الهدف في معظمه خلفية فارغة، فقاعدة
      تموت فور انطلاقها تصيب أغلب البكسلات، وخطأ بكسلي بسيط كان سيعدّ ذلك نتيجة
      لا بأس بها. لهذا تُقسم كل درجة هنا على الخطأ الذي تنتجه شبكة فارغة، فيثبت
      «ألّا تفعل شيئاً» عند الصفر تماماً. والدرجة السالبة ليست خللاً: إنها
      قاعدة ملأت الشبكة بما هو أسوأ من الفراغ.
  - en: >-
      Compare the two training runs line by line before looking for the cause
      anywhere clever. The loss is the same expression, the architecture is the
      same class, the initial weights come from the same seed and the optimizer
      and step budget are identical. The only line that differs is where each
      batch comes from. Whatever separates the two rules at the horizon has to
      have entered through that one difference, which means it entered through
      the distribution of states the rule was asked about — never through
      anything the objective said. The learned dynamics follow what the rule
      was shown, not what it was asked for.
    ar: >-
      قارن التشغيلتين سطراً بسطر قبل أن تبحث عن السبب في مكان أذكى. دالة
      الخسارة هي التعبير نفسه، والبنية هي الصنف نفسه، والأوزان الابتدائية من
      البذرة نفسها، والمحسِّن وميزانية الخطوات متطابقان. السطر الوحيد المختلف
      هو من أين تأتي كل دفعة. إذن كل ما يفصل القاعدتين عند الأفق دخل من ذلك
      الباب وحده: من توزيع الحالات التي سُئلت عنها القاعدة، لا من أي شيء نطقت
      به دالة الهدف. و<Term en="Learned Dynamics">الديناميكيات المتعلَّمة</Term>
      تتبع ما رأته القاعدة، لا ما طُلب منها.
  - en: >-
      A cell only stays alive if it or a neighbour already has meaningful
      alpha, so an erased region cannot start repairing itself from the inside.
      Everything has to re-enter across the boundary of the cut, one cell per
      step. That makes where you cut matter more than how much you cut: a
      wound that leaves a long, healthy border heals from all along it, and a
      cut that isolates a piece of the shape from the rest leaves that piece
      with nothing to grow back from.
    ar: >-
      لا تبقى الخلية حيّة إلا إذا كانت قيمة ألفا ذات معنى عندها أو عند أحد
      جيرانها، ولذلك لا تستطيع منطقة ممحوّة أن تبدأ إصلاح نفسها من داخلها. على
      كل شيء أن يعود عبر حدود القطع، خليةً واحدة في كل خطوة. وهذه
      <Term en="Locality">المحلّية</Term> تجعل موضع القطع أهم من حجمه: جرح يترك
      حدوداً سليمة طويلة يلتئم من طولها كله، أما قطع يعزل جزءاً من الشكل عن
      بقيته فيترك ذلك الجزء بلا شيء ينمو منه.
  - en: >-
      Healing is not faster than growing, and expecting it to be is the usual
      reason a damage run looks like a failure. The rule has one speed — one
      cell per step — and rebuilding half a shape means covering half the grid
      again. If the healed panel looks like an arrested half-flower, try giving
      it the same number of steps the original growth took before concluding
      that the rule cannot do it.
    ar: >-
      الترميم ليس أسرع من النمو، وتوقّع العكس هو السبب المعتاد في أن تبدو
      تشغيلة المحو فاشلة. فللقاعدة سرعة واحدة — خلية واحدة في كل خطوة — وإعادة
      بناء نصف شكل تعني تغطية نصف الشبكة من جديد. فإن بدت لوحة الترميم زهرةً
      نصفية متوقّفة، امنحها العدد نفسه من الخطوات الذي استغرقه النمو الأصلي قبل
      أن تحكم بعجز القاعدة.

terms:
  cellular automaton:
    en: "A grid of cells updated in parallel by one rule that reads only a local neighbourhood. No cell sees the whole grid, and there is no step anywhere that considers it."
    ar: "شبكة خلايا تُحدَّث بالتوازي بقاعدة واحدة لا تقرأ إلا جواراً محلياً. لا خلية ترى الشبكة كاملة، ولا توجد في أي موضع خطوة تنظر إليها ككل."
  morphogenesis:
    en: "The process by which a structure takes shape from local interactions rather than from a blueprint. The question is not what the shape is but what rule makes it appear."
    ar: "تشكُّل بناءٍ من تفاعلات محلية لا من مخطّط مرسوم سلفاً. والسؤال ليس ما هو الشكل، بل ما القاعدة التي تجعله يظهر."
  update rule:
    en: "The function applied to every cell at every step. Here it is a small convolutional network, and it is the only thing that is learned — everything the grid does over time is this one function repeated."
    ar: "الدالة المطبَّقة على كل خلية في كل خطوة، وهي هنا شبكة التفافية صغيرة، وهي وحدها ما يُتعلَّم. فكل ما تفعله الشبكة عبر الزمن تكرارٌ لهذه الدالة وحدها."
  sample pool:
    en: "A store of states produced by the rule on earlier training steps, sampled from instead of always restarting at the seed. It changes which situations the rule is asked about, and nothing else."
    ar: "مخزن حالات أنتجتها القاعدة في خطوات تدريب سابقة، تُسحب منه الدفعات بدل العودة دائماً إلى البذرة. يغيّر المواقف التي تُسأل عنها القاعدة، ولا يغيّر سواها."
  alive masking:
    en: "Zeroing any cell with no meaningful alpha in its neighbourhood, so growth can only spread outward from cells that are already alive. It is what makes an erased region have to be re-entered from its boundary."
    ar: "تصفير كل خلية لا توجد في جوارها قيمة ألفا ذات معنى، فلا ينتشر النمو إلا من خلايا حيّة بالفعل. وهو ما يفرض على المنطقة الممحوّة أن تُستعاد من حدودها."
  regeneration:
    en: "Returning to the target after part of the state is destroyed. Distinct from growth, and — as this run shows — not something a rule acquires just by being good at growing."
    ar: "العودة إلى الهدف بعد إتلاف جزء من الحالة. وهو غير النمو، ولا تكتسبه القاعدة — كما تُظهر هذه التشغيلة — لمجرد إتقانها النمو."

body:
  - type: prose
    text:
      en: >-
        The model is small enough to hold in your head. Each cell carries a
        handful of numbers, four of which are drawn on the screen as colour and
        transparency and the rest of which mean nothing in particular — the
        rule decides what to keep there. At every step, each cell looks at
        itself and its eight neighbours through three fixed filters, passes the
        result through two layers, and adds the output to its own state. That
        is the entire model. The same weights run on every cell.


        Two things in it are worth pausing on, because both are load-bearing
        and neither is obvious. The output layer starts at exactly zero, so the
        untrained rule is the identity and growth has to be learned rather than
        rescued from an explosion. And cells fire independently at random
        rather than all at once, because a grid that steps in lockstep has a
        global clock, and a global clock is the coordination this model is
        supposed to do without.
      ar: >-
        النموذج أصغر من أن يحتاج إلى ورقة. تحمل كل خلية حفنة أرقام، أربعة منها
        تُرسم على الشاشة لوناً وشفافية، وبقيتها لا تعني شيئاً بعينه، فالقاعدة
        هي التي تقرّر ما تحتفظ به هناك. وفي كل خطوة تنظر الخلية إلى نفسها وإلى
        جيرانها الثمانية عبر ثلاثة مرشّحات ثابتة، ثم تمرّر الناتج عبر
        <Term en="Convolutional Layer">طبقتين التفافيتين</Term> وتضيفه إلى
        <Term en="Cell State">حالتها</Term>. هذا هو النموذج كله. والأوزان نفسها
        تعمل على كل خلية.


        أمران فيه يستحقّان التوقّف، فكلاهما حامل للبناء وليس أيّهما بديهياً.
        الأول أن طبقة المخرَج تبدأ من الصفر تماماً، فتكون القاعدة غير المدرَّبة
        هي دالة الهوية، وبذلك يصير النمو شيئاً يُتعلَّم لا شيئاً يُنتشل من
        انفجار عددي. والثاني أن الخلايا تُحدَّث عشوائياً كلٌّ على حدة لا دفعةً
        واحدة، لأن شبكة تخطو في انتظام تامّ تملك ساعة مركزية — والساعة المركزية
        هي بعينها التنسيق الذي يُفترض بهذا النموذج أن يستغني عنه.

  - type: cell
    id: setup
    ref: setup
    caption:
      en: "Preflight. No accelerator is requested — a few thousand parameters over a few hundred cells does not need one, and asking would be theatre."
      ar: "تهيئة مبدئية. لا نطلب مسرّعاً — بضعة آلاف من المعاملات على بضع مئات من الخلايا لا تحتاج إليه، وطلبه سيكون مسرحية."

  - type: cell
    id: target
    ref: target
    captures: [alive_fraction, empty_error]
    caption:
      en: >-
        The shape is drawn, not downloaded, so nothing here can rot. Note that
        it is asymmetric: the leaf sits on one side of the stem and nowhere
        else. A symmetric target would let the damage run at the end succeed by
        mirroring instead of rebuilding, and the number would look the same.
        Keep the empty-grid error printed below — every score in this workshop
        is measured against it.
      ar: >-
        الشكل مرسوم لا مُنزَّل، فلا شيء هنا يتعفّن. ولاحظ أنه غير متماثل:
        الورقة على جانب واحد من الساق ولا وجود لها في غيره. والهدف المتماثل كان
        سيتيح لتشغيلة المحو في النهاية أن تنجح بالمرآة بدل إعادة البناء، والرقم
        نفسه ما كان ليتغيّر. واحتفظ بخطأ الشبكة الفارغة المطبوع أدناه، فعليه
        تُقاس كل درجة في هذه الورشة.

  - type: cell
    id: rule
    ref: rule
    captures: [param_count]
    caption:
      en: >-
        Compare the parameter count against the number of cells on the grid.
        There are not enough parameters here to store a picture, and in any
        case the rule never sees a coordinate — so whatever tells a cell it
        belongs to a petal rather than to the stem is being computed locally,
        every step, from its neighbours. That is what it means for the
        representation to be distributed across the grid rather than stored
        anywhere.
      ar: >-
        قارن عدد المعاملات بعدد خلايا الشبكة. لا تكفي هذه المعاملات لتخزين
        صورة، والقاعدة على أي حال لا ترى إحداثياً واحداً. إذن فما يخبر الخلية
        بأنها بتلة لا ساق يُحسب محلياً في كل خطوة انطلاقاً من جيرانها، وهذا هو
        معنى أن يكون <Term en="Distributed Representation">التمثيل موزّعاً</Term>
        على الشبكة بدل أن يكون مخزّناً في مكان.

  - type: paperRef
    slug: growing-neural-cellular-automata
    note:
      en: >-
        Mordvintsev and colleagues framed this as a model of morphogenesis
        rather than as an image generator, which is why the interesting
        question in their paper is not whether the pattern appears but whether
        it stays and whether it comes back — a question about morphology and
        its persistence, not about the quality of a picture. The sample pool
        and the injected
        damage are their answers to those two questions, and this workshop
        isolates the first of them by removing it.
      ar: >-
        قدّم Mordvintsev وزملاؤه هذا العمل نموذجاً للتخلّق لا مولِّداً للصور،
        ولهذا لم يكن السؤال المثير في ورقتهم هل يظهر النمط، بل هل يبقى وهل
        يعود — أي أنه سؤال عن <Term en="Morphology">البنية الشكلية</Term>
        وبقائها لا عن جودة صورة. ومجمّع العيّنات والتلف المحقون جوابهما عن هذين
        السؤالين، وهذه الورشة تعزل الأول بأن تنزعه.

  - type: scaleNote
    text:
      en: >-
        The free profile works on a {{scale.grid}}-square grid with
        {{scale.channels}} channels per cell, and trains each rule for
        {{scale.trainSteps}} steps with rollouts sampled between
        {{scale.minSteps}} and {{scale.maxSteps}} applications. Persistence is
        then probed out to {{scale.persistSteps}} steps — several times
        anything either rule was trained through. The paper profile raises the
        grid, the channel count and the budget together; the shape of the
        finding transfers, the step counts do not.
      ar: >-
        يعمل المستوى المجاني على شبكة ضلعها {{scale.grid}} وبعدد
        {{scale.channels}} قناة لكل خلية، ويدرّب كل قاعدة {{scale.trainSteps}}
        خطوة بجولات تُسحب أطوالها بين {{scale.minSteps}} و{{scale.maxSteps}}
        تطبيقاً. ثم يُختبر الثبات حتى {{scale.persistSteps}} خطوة، أي أضعاف ما
        دُرِّبت عبره أيٌّ من القاعدتين. أما مستوى الورقة فيرفع الشبكة وعدد
        القنوات والميزانية معاً؛ ينتقل شكل النتيجة، ولا تنتقل أعداد الخطوات.

  - type: cell
    id: train
    ref: train
    captures: [naive_final_loss, pool_final_loss, train_seconds]
    caption:
      en: >-
        The long cell, and the only one that trains anything. Two rules, run
        back to back, with backpropagation reaching through several dozen
        consecutive applications of the same rule in both. Watch the two final
        losses: the seed-only rule's is the lower of the two by a wide margin,
        and it also ends up with the closer match to the flower. Every number
        visible while training runs says it is the better rule. That is the
        setup, because it is the one that does not survive the next cell.
      ar: >-
        الخلية الطويلة، وهي وحدها التي تدرّب شيئاً. قاعدتان، الواحدة تلو
        الأخرى، ويمرّ <Term en="Backpropagation">الانتشار العكسي</Term> في
        كلتيهما عبر عشرات التطبيقات المتتالية للقاعدة نفسها. وراقب الخسارتين
        النهائيتين: خسارة قاعدة البذرة أدنى بفارق واسع، ومطابقتها للزهرة أقرب
        كذلك. كل رقم يظهر أثناء التدريب يقول إنها القاعدة الأفضل. وهذا هو
        التمهيد بعينه، لأنها هي التي لا تنجو من الخلية التالية.

  - type: cell
    id: growth
    ref: growth
    captures: [pool_match]
    thumbnail: true
    caption:
      en: >-
        One cell, then a few dozen applications of one rule, left to right. The
        thing to watch is the boundary: growth only ever happens at the edge of
        what is already alive, because a cell with no living neighbour is
        switched off before it can do anything. The flower is not drawn
        outward from a plan. It is behaviour emerging from the local rule: the
        only stable thing that rule knows how to build.
      ar: >-
        خلية واحدة، ثم بضع عشرات من تطبيقات قاعدة واحدة، من اليسار إلى اليمين.
        وما يستحق المراقبة هو الحدّ: لا يقع النمو إلا عند حافة ما هو حيّ
        بالفعل، لأن الخلية التي لا جار حيّ لها تُطفأ قبل أن تفعل شيئاً. الزهرة
        ليست مرسومة من الداخل إلى الخارج وفق خطة، بل هي
        <Term en="Emergent Behavior">سلوك ناشئ</Term> عن القاعدة المحلية: الشيء
        الثابت الوحيد الذي تعرف كيف تبنيه.

  - type: cell
    id: persistence
    ref: persistence
    captures: [naive_match_trained, naive_match_long, pool_match_long, persistence_gap]
    caption:
      en: >-
        The shaded band on the left is the range either rule was ever trained
        through; everything to the right of it is a question neither was asked.
        The seed-only rule climbs highest, holds the flower for a while after
        the band ends, and then comes apart — gradually, with nothing going
        visibly wrong at any single step. Watch the snapshots underneath rather
        than only the curve: the decay is petals speckling and the stem
        breaking up, not a collapse. The flower was a place its trajectory
        passed through, never an attractor it was pulled toward.
      ar: >-
        الشريط المظلّل على اليسار هو المدى الذي دُرِّبت عبره القاعدتان، وكل ما
        يمينه سؤال لم تُسأله أيٌّ منهما. تصعد قاعدة البذرة إلى أعلى نقطة، وتحفظ
        الزهرة مدّةً بعد نهاية الشريط، ثم تتفكّك تدريجياً دون أن يبدو أن شيئاً
        أخطأ في أي خطوة بعينها. وانظر إلى اللقطات أسفل المنحنى لا إلى المنحنى
        وحده: التدهور هو تنقّط البتلات وتفتّت الساق، لا انهيار مفاجئ. كانت
        الزهرة موضعاً عبره مسارها، لا <Term en="Attractor">جاذباً</Term> يشدّها
        إليه.

  - type: prose
    text:
      en: >-
        So one rule stays and the other does not, and nothing in either
        objective ever mentioned staying. That is worth being precise about,
        because the tempting summary — that robustness comes along for free
        with growth — is the one thing this run rules out. Both rules grew. One
        of them was additionally trained on states that were already grown, and
        on a few that had holes in them, and that is where persistence came
        from.


        Which sets up the last question. A rule that holds its shape is not
        obviously a rule that can rebuild it: staying still and coming back are
        different behaviours, and only one of them was ever in the training
        distribution. Cut the flower in half and find out.
      ar: >-
        إذن قاعدة تبقى وأخرى لا تبقى، ولم تذكر أيٌّ من دالتَي الهدف البقاء
        إطلاقاً. ويستحقّ هذا دقّةً في الصياغة، لأن الخلاصة المغرية — أن
        <Term en="Robustness">المتانة</Term> تأتي مجاناً مع النمو — هي بالضبط
        ما تستبعده هذه التشغيلة. فكلتا القاعدتين نمت. لكن إحداهما دُرِّبت فوق
        ذلك على حالات نمت بالفعل، وعلى قليل منها مثقوب، ومن هناك جاء الثبات.


        وهذا يمهّد للسؤال الأخير. القاعدة التي تحفظ شكلها ليست بالضرورة قادرة
        على إعادة بنائه: الثبات والعودة سلوكان مختلفان، وواحد منهما وحده كان
        يوماً داخل توزيع التدريب. اقطع الزهرة نصفين واعرف الجواب.

  - type: cell
    id: damage
    ref: damage
    captures: [stable_match, damaged_match, healed_match, recovery]
    caption:
      en: >-
        Four panels: the target, the grown flower, the flower with half the
        grid zeroed, and the same state left to run. Every channel is erased in
        the cut, hidden ones included, so there is no surviving scaffold to
        rebuild from — the region has to be re-entered across the boundary, one
        cell per step. This is not image restoration from what survived; it is
        rebuilding from the boundary inward. Check the leaf specifically. It was only ever on the
        erased side, so it cannot be mirrored back from anywhere; if it returns
        on the correct side, the rule reconstructed it rather than copying it.
      ar: >-
        أربع لوحات: الهدف، والزهرة بعد النمو، والزهرة وقد صُفِّر نصف شبكتها، ثم
        الحالة نفسها وقد تُركت تعمل. والمحو يطال القنوات كلها بما فيها المخفية،
        فلا يبقى هيكل ناجٍ يُبنى عليه، وعلى المنطقة أن تُستعاد عبر حدودها خليةً
        واحدة في كل خطوة. وهذا ليس <Term en="Image Restoration">ترميم صورة</Term>
        من بقاياها، بل إعادة بناء من الحدّ. وتفقّد الورقة تحديداً: لم تكن قط
        إلا في الجهة الممحوّة، فلا سبيل إلى استنساخها من مكان آخر. فإن عادت في
        جهتها الصحيحة، فالقاعدة أعادت بناءها ولم تنقلها.

  - type: exercise
    id: choose-damage
    ref: choose_damage
    prompt:
      en: >-
        Nothing retrains here. The rule is fixed and you are choosing what to
        do to a finished flower.


        Pick a side to erase and a number of steps to allow. Then look for the
        boundary of what this rule can do, which is more interesting than the
        recovery number: find a cut it comes back from completely, and a cut it
        cannot come back from at all. The second one exists. When you find it,
        the question to answer is not whether the rule is weak but what the cut
        took away — the rule only ever moves information one cell per step,
        outward from something already alive.
      ar: >-
        لا شيء يُعاد تدريبه هنا. القاعدة ثابتة، وأنت تختار ما تفعله بزهرة
        مكتملة.


        اختر جهةً تمحوها وعدداً من الخطوات تسمح بها. ثم ابحث عن حدود ما تقدر
        عليه هذه القاعدة، فذلك أطرف من رقم الاستعادة نفسه: جد قطعاً تعود منه
        تماماً، وقطعاً لا تعود منه أبداً. والثاني موجود. وحين تجده فالسؤال ليس
        هل القاعدة ضعيفة، بل ماذا أخذ منها ذلك القطع: فهي لا تنقل المعلومة إلا
        خليةً واحدة في كل خطوة، خارجةً من شيء حيّ بالفعل.
    hint: 3

  - type: cell
    id: verify
    ref: verify
    caption:
      en: >-
        The control is checked first and deliberately. The finding is that the
        seed-only rule arrives and then leaves, and a rule that never arrived
        never left — so without that check the other three numbers could be
        describing two rules that simply both failed to learn the task.
      ar: >-
        يُفحص الضابط أولاً وعن قصد. فالنتيجة هي أن قاعدة البذرة تبلغ الهدف ثم
        تغادره، والقاعدة التي لم تبلغه قط لم تغادره قط. فبدون هذا الفحص قد تكون
        الأرقام الثلاثة الأخرى وصفاً لقاعدتين أخفقتا كلتاهما في تعلّم المهمة
        أصلاً.

  - type: cell
    id: finish
    ref: finish
