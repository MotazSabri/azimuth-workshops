schema: workshop/v1
id: reward-shaping-gone-wrong
constellation: agents

title:
  en: "Reward shaping, and how it goes wrong"
  ar: "تشكيل المكافأة — وكيف ينحرف"

concept:
  en: "The agent optimises what you wrote, not what you meant"
  ar: "الوكيل يُحسِّن ما كتبتَه، لا ما قصدتَه"

scenario:
  en: >-
    Sparse rewards are hard to learn from: an agent that only scores on
    success spends most of training seeing nothing at all. So you help it.
    You add a term for progress — distance closed, fuel saved, altitude held —
    and learning speeds up immediately. That term is a shaping reward, and it
    is the most common intervention in applied RL.


    It is also where the failures live. The agent does not read your intent;
    it reads the sum. If some behaviour you never considered scores higher
    than the behaviour you wanted, it will find that behaviour, and it will
    look like success on your own metric while doing the opposite of the job.
  ar: >-
    التعلّم من <Term en="Sparse Reward">مكافأة متفرّقة</Term> صعب.
    <Term en="Agent">الوكيل</Term> الذي لا يُكافأ إلا عند النجاح يقضي معظم التدريب
    دون أن تصله أي إشارة. فتقرّر أن تساعده: تضيف حدًّا يكافئ التقدّم، كالمسافة
    التي قطعها نحو الهدف، أو الوقود الذي وفّره، أو الارتفاع الذي حافظ عليه.
    ويتسارع التعلّم فورًا. بهذا الحدّ الإضافي تكون قد مارستَ
    <Term en="Reward Shaping">تشكيل المكافأة</Term>، وهو أكثر التدخّلات شيوعًا في
    تطبيقات <Term en="Reinforcement Learning">التعلّم المعزّز</Term>.


    وهنا بالضبط تبدأ الإخفاقات. الوكيل لا يقرأ نيّتك، بل يقرأ مجموع المكافآت كما
    كتبتَه. فإن كان هناك سلوك لم يخطر لك يحصد درجة أعلى من السلوك الذي أردتَه،
    فسيعثر عليه. وسيبدو ناجحًا بمقياسك أنت، بينما يفعل عكس المطلوب تمامًا.

goal:
  en: >-
    Train the same agent on three reward functions — the environment's own, a
    correct potential-based shaping, and one plausible mis-specification —
    then show that the mis-specified agent scores best on the shaped reward
    and worst on the thing you actually wanted.
  ar: >-
    ندرّب الوكيل نفسه ثلاث مرّات، ولا يتغيّر بينها إلا
    <Term en="Reward Function">دالة المكافأة</Term>: مرّة على مكافأة البيئة كما
    هي، ومرّة مع <Term en="Potential-Based Shaping">تشكيل صحيح قائم على الجهد</Term>،
    ومرّة مع صياغة ثالثة تبدو معقولة لكنها خاطئة. ثم نُثبت أن الوكيل الثالث يحصد
    أعلى درجة وفق المكافأة المُشكَّلة، وأسوأ نتيجة فيما أردناه فعلًا.

difficulty: intermediate
status: stable
publishedAt: "2026-08-27"

maintenance:
  # moderate: gymnasium is one pinned third-party library. No downloaded
  # weights, no gated assets — the environment is generated, not fetched.
  tier: moderate
  cadence: quarterly

estimate:
  gpuMinutes: 0
  totalMinutes: 45

papers:
  - slug: ppo
    role: core
    label:
      en: "the policy-gradient method almost every applied RL system reaches for — Schulman et al., 2017"
      ar: "خوارزمية تدرّج السياسة التي يلجأ إليها كل نظام تعلّم معزّز تطبيقي تقريبًا — شولمان وزملاؤه، 2017"
  - slug: concrete-problems
    role: core
    label:
      en: "reward hacking named as a research problem, nine years before it was a headline — Amodei et al., 2016"
      ar: "سُمّي اختراق المكافأة مسألةً بحثية قبل أن يتصدّر الأخبار بتسع سنوات — أمودي وزملاؤه، 2016"
  - slug: reinforce
    role: supporting
    label:
      en: "the gradient estimator underneath, and why reward variance matters so much"
      ar: "مُقدِّر التدرّج الذي يقوم عليه كل شيء هنا، ولماذا يهمّ تباين المكافأة إلى هذا الحدّ"
  - slug: deep-rl-human-preferences
    role: supporting
    label:
      en: "one answer to a reward you cannot write down: learn it from comparisons instead"
      ar: "حين تعجز عن كتابة المكافأة بنفسك، هناك مخرج: أن تتعلّمها من مقارنات بشرية"

assets: []

# ── dependencies ────────────────────────────────────────────────────────────
# Emitted as a pip/apt cell right after setup. Pinned, because "whatever PyPI
# had that morning" is not a reproducible run — and this is a `moderate`-tier
# workshop precisely because these exist.
#
# box2d needs swig to build its Python bindings, and Colab does not ship it.
# That is an apt package, not a pip one, so it needs its own line.
dependencies:
  apt:
    - swig
  pip:
    - "gymnasium[box2d]==1.2.0"
    - "arabic-reshaper"
    - "python-bidi"

profiles:
  - id: free
    default: true
    name:
      en: "Free tier (CPU is enough)"
      ar: "المستوى المجاني (المعالج المركزي يكفي)"
    requires:
      # LunarLander with a small MLP policy is CPU work. Declaring a GPU it
      # does not need would send CI to a GPU runner for nothing.
      gpu: false
      vramGb: 0
      ramGb: 4
    scale:
      # 600 was too few: the CONTROL agent never landed, so the comparison had
      # nothing to compare against. Raised until the honest agent actually
      # solves the task — an untrained control makes the whole workshop
      # vacuous, however good the exploit looks beside it.
      episodes: 1500
      evalEpisodes: 50
      hidden: 128
      learningRate: 0.0007
      gamma: 0.99
      seed: 17
  - id: long
    name:
      en: "Longer training"
      ar: "تدريب أطول"
    requires:
      gpu: false
      vramGb: 0
      ramGb: 8
    scale:
      episodes: 2500
      evalEpisodes: 200
      hidden: 256
      learningRate: 0.0005
      gamma: 0.99
      seed: 17

checks:
  # THE CONTROL MUST WORK FIRST.
  #
  # Without this, the comparison passes on a run that demonstrates nothing: at
  # 600 episodes every agent landed 0%, `landing_ratio` came out 0/0 -> 0, and
  # "the exploit lands less than half as often" was satisfied by an exploit
  # and a control that both never landed. A vacuous pass is worse than a
  # failure — it certifies an empty result.
  #
  # An untrained control cannot be out-performed, so this check gates the
  # other two: if it fails, the answer is more episodes, not a smaller bar.
  - id: honest-agent-works
    required: true
    min: 0.3
    label:
      en: "Landing rate of the control agent, before any comparison is meaningful"
      ar: "نسبة هبوط الوكيل الشاهد — لا معنى لأي مقارنة قبل أن ينجح هو أولًا"

  - id: hacked-scores-higher
    # A DIFFERENCE in return, not a ratio. These returns are negative, and a
    # ratio over signed values is meaningless — the first version computed
    # -742.9 / 1372.6 = -0.54 and read as "the exploit lost" when it had won
    # by 630 points. Any positive number proves the exploit out-scores the
    # honest agent on the objective as written; 50 is a margin against noise.
    required: true
    min: 50
    label:
      en: "How far the mis-specified agent out-scores the honest one, on the written objective"
      ar: "بكم يتفوّق الوكيل المُخترِق على الأمين في الهدف كما كُتب"
  - id: hacked-lands-less
    required: true
    max: 0.5
    label:
      en: "Mis-specified agent's landing rate, relative to the honest agent's"
      ar: "نسبة هبوط الوكيل المُخترِق مقارنةً بنسبة هبوط الأمين"

hints:
  - en: >-
      Shaping is safe when it is potential-based: reward the CHANGE in some
      potential function, γ·Φ(s′) − Φ(s), and never the state itself. Ng,
      Harada and Russell proved that this form leaves the optimal policy
      unchanged. Anything else — including the obvious "give points for being
      close" — can and does change what is optimal.
    ar: >-
      <Term en="Reward Shaping">التشكيل</Term> آمن حين يقوم على الجهد: أي أن تكافئ
      التغيُّر في دالة جهد ما، γ·Φ(s′) − Φ(s)، لا الحالة نفسها. أثبت نغ وهارادا
      وراسل أن هذه الصيغة تُبقي <Term en="Optimal Policy">السياسة المثلى</Term>
      كما هي. أمّا أي صيغة أخرى، بما فيها الفكرة البديهية «أعطه نقاطًا لأنه قريب»،
      فقد تغيّر السياسة المثلى. وهي تغيّرها فعلًا.
  - en: >-
      Watch what the hacked agent actually does, not just its score. Hovering
      close to the pad collects the proximity bonus every single step and
      never risks the crash penalty. It is not confused; it found a better
      policy for the reward you wrote.
    ar: >-
      لا تكتفِ بالدرجة، بل راقب ما يفعله <Term en="Agent">الوكيل</Term> المُخترِق
      فعلًا. التحويم قرب المنصّة يجمع مكافأة القرب في كل خطوة، دون أي مخاطرة
      بعقوبة التحطّم. الوكيل ليس مرتبكًا. لقد وجد <Term en="Policy">سياسة</Term>
      أفضل للمكافأة التي كتبتَها أنت.
  - en: >-
      If the mis-specified agent is not out-scoring the honest one, your bonus
      is probably too small to compete with the environment's own terms. Raise
      it until the exploit is worth more than the landing. That the exploit
      has a price, and that the price is a number you chose, is itself the
      lesson.
    ar: >-
      إن لم يتفوّق الوكيل المُخترِق على الأمين، فالأرجح أن مكافأتك الإضافية أضعف
      من أن تنافس حدود مكافأة <Term en="Environment">البيئة</Term> نفسها. ارفع
      المُعامل حتى تصير الثغرة أثمن من الهبوط. ولاحظ ما يعنيه ذلك: للثغرة ثمن،
      وهذا الثمن رقم اخترتَه أنت. وهذا بالضبط هو الدرس.

terms:
  reward shaping:
    en: "Adding terms to a reward to make it easier to learn from. Safe only in a specific form; otherwise it changes what the agent is optimising."
    ar: "إضافة حدود مساعدة إلى دالة المكافأة كي يتعلّم منها الوكيل أسرع. لا تكون آمنة إلا في صيغة واحدة محدّدة، وأي صيغة أخرى قد تُغيّر ما يُحسِّنه الوكيل فعليًّا."
  reward hacking:
    en: "Scoring highly on the written objective while failing the intended one. Not a malfunction — the agent solved the problem you actually posed."
    ar: "أن يحصد الوكيل درجة عالية وفق الهدف المكتوب بينما يُخفق في الهدف الذي قصدتَه. ليس خللًا تقنيًّا — الوكيل حلّ المسألة التي طرحتَها حرفيًّا."
  policy:
    en: "The rule mapping what the agent sees to what it does. Training changes the rule; the reward decides which rules are good."
    ar: "القاعدة التي تحدّد كيف يتصرّف الوكيل بناءً على ما يراه. التدريب يُعدّل هذه القاعدة، والمكافأة هي التي تقرّر أيّ القواعد أفضل."
  return:
    en: "The discounted sum of rewards over an episode. What the agent maximises, and the only thing it maximises."
    ar: "المجموع المخصوم للمكافآت على مدى حلقة كاملة. هذا ما يسعى الوكيل إلى تعظيمه، ولا شيء غيره."

body:
  - type: prose
    text:
      en: >-
        The exploit you are about to see is not the one most people predict.
        Ask yourself, before running anything, what an agent does when the
        bonus you added is negative at every point in the state space.


        LunarLander gives you a clean case to break. Its own reward already
        balances several things — distance to the pad, fuel spent, a large
        bonus for landing and a large penalty for crashing — and an agent
        trained on it learns to land.


        We will keep that agent as the control, then add two shaping terms to
        it. One is provably safe. The other is the kind of thing a reasonable
        engineer writes on a Tuesday afternoon.
      ar: >-
        الثغرة التي ستراها هنا ليست ما يتوقّعه معظم الناس. قبل أن تشغّل أي شيء،
        اسأل نفسك: ماذا يفعل الوكيل حين تكون المكافأة التي أضفتَها سالبة في كل
        نقطة من فضاء الحالات؟


        <Term en="Environment">بيئة</Term> LunarLander مثال واضح يسهل أن نكسره
        عمدًا. مكافأتها الأصلية توازن بين عدّة عوامل: المسافة إلى منصّة الهبوط،
        والوقود المستهلَك، ومكافأة كبيرة عند الهبوط، وعقوبة كبيرة عند التحطّم.
        و<Term en="Agent">الوكيل</Term> الذي يتدرّب عليها يتعلّم الهبوط فعلًا.


        سنُبقي هذا الوكيل شاهدًا نقارن به، ثم نضيف إلى مكافأته حدَّين من
        <Term en="Reward Shaping">التشكيل</Term>. أحدهما آمن ببرهان رياضي. والآخر من
        النوع الذي يكتبه أي مهندس كفء في يوم عمل عادي.

  - type: cell
    id: setup
    title:
      en: "Preflight"
      ar: "تهيئة أولية"
    ref: setup
    caption:
      en: "Preflight. No GPU, no downloads — the environment is generated, not fetched."
      ar: "تهيئة أوّلية. لا حاجة لمعالج رسوميّات ولا لتنزيل شيء — البيئة تُولَّد محليًّا."

  - type: cell
    id: rewards
    title:
      en: "Read the three rewards"
      ar: "قراءة دوال المكافأة الثلاث"
    ref: rewards
    caption:
      en: >-
        Read the three functions before you run anything. Decide now which one
        you think will land most often — the point is partly to be wrong.
      ar: >-
        اقرأ الدوال الثلاث قبل أن تُشغّل أي خليّة. وقرّر الآن: أيّها سيُنتج وكيلًا
        يهبط أكثر من غيره؟ جزء من الفكرة أن يأتي توقّعك خاطئًا.

  - type: paperRef
    slug: concrete-problems
    note:
      en: >-
        Amodei and colleagues listed reward hacking in 2016 as one of five
        concrete problems, with examples that read as hypothetical at the
        time. The exploit you are about to train is the same failure at a
        scale you can watch in four minutes.
      ar: >-
        عام 2016 عدّ أمودي وزملاؤه <Term en="Reward Hacking">اختراق المكافأة</Term>
        واحدًا من خمس مسائل بحثية ملموسة، وكانت أمثلتهم تبدو افتراضية حينها. الوكيل
        الذي ستدرّبه بعد قليل يقع في الإخفاق نفسه، لكن على نطاق صغير تشاهده في أربع
        دقائق.

  - type: cell
    id: train
    title:
      en: "Train three agents"
      ar: "تدريب ثلاثة وكلاء"
    ref: train
    captures: [shaped_advantage, landing_ratio, honest_landing, hacked_landing]
    caption:
      en: "Three agents, one architecture, one seed. Only the reward differs."
      ar: "ثلاثة وكلاء، معمارية واحدة، بذرة عشوائية واحدة. ما يختلف هو دالة المكافأة فقط."

  - type: scaleNote
    text:
      en: >-
        The free profile trains {{scale.episodes}} episodes per agent and
        evaluates on {{scale.evalEpisodes}}. The control agent has to actually
        land for any of this to mean anything — that is the first check, and if
        it fails the answer is more episodes, never a lower bar.
      ar: >-
        في الإعداد المجاني يتدرّب كل <Term en="Agent">وكيل</Term> على
        {{scale.episodes}} <Term en="Episode">حلقة</Term> ويُقيَّم على
        {{scale.evalEpisodes}} حلقة. الفحص الأوّل هو أن ينجح الوكيل الشاهد في
        الهبوط فعلًا، فمن دون ذلك لا معنى لأي مقارنة. وإن أخفق، فالحلّ هو زيادة
        عدد الحلقات، لا تخفيف معيار النجاح.

  - type: cell
    id: scoreboard
    title:
      en: "Two columns, two verdicts"
      ar: "عمودان وحُكمان مختلفان"
    ref: scoreboard
    captures: [shaped_ratio, landing_ratio, honest_landing, hacked_landing]
    thumbnail: true
    caption:
      en: >-
        Two columns, two different verdicts. The shaped-score column is what
        the training loop saw; the landing column is what you wanted. Read
        them against each other.
      ar: >-
        عمودان يحكيان قصّتين مختلفتين. عمود الدرجة المُشكَّلة هو كل ما رآه الوكيل
        أثناء التدريب، وعمود الهبوط هو ما أردتَه أنت. اقرأ كلًّا منهما في ضوء الآخر.

  - type: cell
    id: watch
    title:
      en: "Watch the episode length"
      ar: "مراقبة طول الحلقة"
    ref: watch
    caption:
      en: >-
        One trajectory each, compared. Episode LENGTH is the tell — read it
        before you read anything else.
      ar: >-
        مسار واحد لكلٍّ من الوكيلين المُخترِق والأمين، جنبًا إلى جنب. طول الحلقة هو
        المفتاح، فانظر إليه قبل أي رقم آخر.

  - type: exercise
    id: fix-it
    title:
      en: "Fix the reward"
      ar: "إصلاح دالة المكافأة"
    ref: fix_it
    prompt:
      en: >-
        Repair the mis-specified reward without deleting it. Potential-based
        shaping is the known-safe form: reward γ·Φ(s′) − Φ(s) rather than Φ(s)
        itself. Convert the proximity bonus into that form and retrain.


        Then answer the question the fix raises. If potential-based shaping
        provably cannot change the optimal policy, what did you actually buy
        by adding it? Compare not just the final landing rate but how many
        episodes each agent needed to get there.
      ar: >-
        أصلِح المكافأة الخاطئة من غير أن تحذفها. الصيغة المعروفة بأمانها هي
        <Term en="Reward Shaping">التشكيل</Term> القائم على الجهد. الفكرة أن تكافئ
        الوكيل على تغيُّر الجهد من خطوة إلى التي تليها، لا على قيمة الجهد حيث يقف.
        بالرموز: كافئ γ·Φ(s′) − Φ(s) بدلًا من Φ(s) نفسها، حيث γ هو
        <Term en="Discount Factor">معامل الخصم</Term>. حوِّل مكافأة القرب إلى هذه
        الصيغة وأعِد التدريب.


        ثم فكّر في السؤال الذي يطرحه هذا الإصلاح. إن كان التشكيل القائم على الجهد
        لا يستطيع، بالبرهان، أن يغيّر <Term en="Optimal Policy">السياسة المثلى</Term>،
        فماذا كسبتَ فعلًا بإضافته؟ لا تقارن نسبة الهبوط النهائية فحسب، بل قارن أيضًا
        عدد <Term en="Episode">الحلقات</Term> التي احتاجها كل وكيل ليصل إليها.
    hint: 1

  - type: cell
    id: verify
    title:
      en: "Check both, one is a max"
      ar: "التحقّق من الفحصين"
    ref: verify
    caption:
      en: "Both checks. The second is a MAXIMUM: the exploit must land less, or nothing was demonstrated."
      ar: "الفحصان معًا. الثاني حدّ أقصى: يجب أن يهبط الوكيل المُخترِق أقلّ من الأمين، وإلّا فلم نُثبت شيئًا."

  - type: cell
    id: finish
    title:
      en: "Completion code"
      ar: "رمز الإتمام"
    ref: finish