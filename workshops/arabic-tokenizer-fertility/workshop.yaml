schema: workshop/v1
id: arabic-tokenizer-fertility
constellation: language

title:
  en: "Tokenizers and the Arabic tax"
  ar: "المُجزِّئات والضريبة العربية"

concept:
  en: "Fertility is a price, paid per token"
  ar: "الخصوبة ثمنٌ تدفعه مع كل رمز"

scenario:
  en: >-
    The same sentence costs more in Arabic than in English. Not metaphorically
    — measurably, in tokens, and tokens are what you pay for and what fills
    your context window. So an Arabic reader pays twice: a higher bill for
    identical content, and a shorter effective context from the same model.


    What this workshop measures is not just that the gap exists but how much
    of it is anyone's fault. Run it and you will find the same Arabic
    sentences costing one production tokenizer about four times what they cost
    another — a factor of {{run.metrics.ratio}} on the worst of the three.
    That spread is the whole point: the tax is not a property of Arabic, it is a
    procurement decision, and somebody made it.
  ar: >-
    خذ جملة واحدة واكتبها بالعربية ثم بالإنجليزية، وأرسل النسختين إلى نموذج لغوي:
    ستجد أن النسخة العربية تستهلك رموزاً أكثر. ليس هذا تعبيراً مجازياً — الفرق
    يُقاس بالرموز، والرموز هي وحدة الحساب: بها يُسعَّر الاستخدام وبها تُقاس نافذة
    السياق. النتيجة أن القارئ العربي يتحمّل عبئاً مزدوجاً: فاتورة أعلى للمحتوى
    نفسه، وسياق فعلي أقصر من النموذج ذاته.


    لكن ما نقيسه هنا ليس مجرّد وجود الفجوة، بل مقدار ما يعود منها إلى قرارات
    تصميمية. شغّل الكود وستجد أن الجمل العربية نفسها تكلّف أحد المُجزِّئات
    الإنتاجية نحو أربعة أضعاف ما تكلّفه مُجزِّئاً آخر — بمعامل
    {{run.metrics.ratio}} في أسوأ الحالات. هذا التفاوت هو بيت القصيد:
    «الضريبة» ليست خاصيةً ملازمة للعربية، بل قرار شراء اتخذه
    مصمّم المُجزِّئ.

goal:
  en: >-
    Measure fertility — tokens per word — for the same parallel text in Arabic
    and English across three production tokenizers, convert the ratio into what
    it actually costs in context window and inference price, and find the
    single change to the text that moves the number most.
  ar: >-
    قِس الخصوبة — أي كم رمزاً يلزم لتمثيل كل كلمة — على النص المتوازي نفسه
    بالعربية والإنجليزية عبر ثلاثة مُجزِّئات إنتاجية، ثم حوِّل هذه النسبة إلى أثرها
    الفعلي على نافذة السياق وتكلفة الاستدلال، وأخيراً جِد التعديل النصّي الواحد
    الذي يُحدث أكبر فرق.

difficulty: beginner # foundational | beginner | intermediate | advanced (PaperMeta)
status: stable # stable | draft (PaperMeta)
publishedAt: "2026-08-26"

maintenance:
  # moderate: one third-party library (`tokenizers`) plus downloaded tokenizer
  # files. No model weights, no gated assets — the vocabularies are small and
  # publicly served.
  tier: moderate
  cadence: quarterly

estimate:
  # No accelerator: this is string processing. Measure and correct after the
  # first real run.
  gpuMinutes: 0
  totalMinutes: 25

papers:
  - slug: bpe
    role: core
    label:
      en: "the merge algorithm every modern tokenizer descends from — Sennrich, Haddow & Birch, 2016"
      ar: "خوارزمية الدمج التي اشتُقّت منها المُجزِّئات الحديثة كلّها — Sennrich وHaddow وBirch، 2016"
  - slug: bloom
    role: core
    label:
      en: "what it costs to build a vocabulary for 46 languages instead of one"
      ar: "ثمن بناء مفردات تخدم ستّاً وأربعين لغة بدلاً من واحدة"
  - slug: fasttext
    role: supporting
    label:
      en: "subword units before transformers: the same problem, an older answer"
      ar: "الوحدات دون الكلمة قبل عصر المحوِّلات: المسألة نفسها بحلّ أقدم"

assets:
  - name: parallel.tsv
    # Small on purpose: fertility is a ratio, and a few thousand aligned
    # sentence pairs measure it as precisely as a million would.
    bytes: 3926582 # exact, from the pinned download
    sha256: 52168ce2dee7bc62c9c69d14a80ac05c8059cfaec684a3c233f6d7a811d72338
    license: "Tatoeba — CC BY 2.0 FR"
    sources:
      # Ours first, deliberately — the inverse of the usual order. This corpus
      # was assembled and trimmed for this workshop rather than fetched whole,
      # so our copy IS the canonical one and Tatoeba is the provenance, not a
      # live dependency. Pointing at their download first would make the
      # workshop fail the day they re-cut a release.
      #
      # `main`, NOT `stable`. Notebooks are served from stable; ASSETS are not,
      # and pinning them there deadlocks the workflow: a corrected dataset
      # pushed to main is invisible until promote runs, and promote should not
      # run until the corrected dataset has been tested. Worse, it fails
      # silently — the old sha256 still matches the old file, so the run
      # reports "verified" while measuring stale data. That cost a full
      # round-trip to diagnose.
      #
      # Branch pinning buys nothing here anyway: sha256 is what guarantees the
      # bytes. The branch only decides which bytes you get offered, and the
      # hash refuses them if they are wrong.
      - "https://raw.githubusercontent.com/MotazSabri/azimuth-workshops/main/mirror/ara-eng-parallel.tsv"
    description:
      en: "Aligned Arabic/English sentence pairs, one pair per line, tab-separated."
      ar: "جمل متوازية عربية–إنجليزية، زوج في كل سطر، مفصولة بعلامة جدولة."

profiles:
  - id: free
    default: true
    name:
      en: "Any runtime (no GPU)"
      ar: "أي بيئة تشغيل (بلا GPU)"
    requires:
      # String processing. Asking for an accelerator here would be theatre,
      # and declaring it honestly is what lets CI run this on a CPU runner.
      gpu: false
      vramGb: 0
      ramGb: 2
    scale:
      sampleSentences: 1000
      # Prices are inputs, not facts — they change, and a workshop that hard-codes
      # them lies quietly. Overridable here so a reader can plug in their own.
      pricePerMillionTokens: 3.0
      contextWindow: 8192
      seed: 17
  - id: full
    name:
      en: "Whole corpus"
      ar: "المدوّنة كاملة"
    requires:
      gpu: false
      vramGb: 0
      ramGb: 8
    scale:
      sampleSentences: 0 # 0 means "all"
      pricePerMillionTokens: 3.0
      contextWindow: 8192
      seed: 17

checks:
  - id: fertility-measured
    # 2.0 is deliberately below the measured value: the check should confirm a
    # real gap exists, not pin an exact number, because the ratio reported is
    # the WORST tokenizer's and a Hub outage that drops GPT-2 would leave a
    # multilingual tokenizer's much smaller ratio as the maximum.
    #
    # The floor matters more than it looks. A run with the corpus columns
    # swapped reported 0.798 — "Arabic is cheaper than English" — precise,
    # confident and exactly backwards. Nothing errored, because both columns
    # are text and the arithmetic is the same either way. A ratio below 1 is
    # not a finding about Arabic; it is a wiring fault, and this check is the
    # only thing that says so out loud.
    required: true
    min: 2.0
    label:
      en: "Arabic fertility, as a multiple of English"
      ar: "خصوبة العربية كمضاعف للإنجليزية"
  - id: tokenizers-compared
    required: true
    min: 3
    label:
      en: "Tokenizers measured"
      ar: "عدد المُجزِّئات التي جرى قياسها"

hints:
  - en: >-
      Fertility is tokens ÷ words, and "words" has to mean the same thing in
      both languages or the ratio is meaningless. Whitespace splitting is the
      honest choice here: it undercounts Arabic morphology, which makes your
      number a LOWER bound on the real gap rather than a flattering one.
    ar: >-
      الخصوبة = الرموز ÷ الكلمات. لكن لا بدّ أن يكون تعريف «الكلمة» واحداً في
      اللغتين وإلا فقدت النسبة معناها. التقسيم بالمسافات هو الخيار الأمين: يُقلّل
      من تقدير الصرف العربي فعلاً، لكنه بذلك يجعل رقمك حدّاً أدنى للفجوة
      الحقيقية بدل أن يبالغ فيها.
  - en: >-
      Look at the actual pieces, not just the average. Print the token strings
      for one sentence. The English words survive whole; the Arabic ones break
      at the definite article, then again at the affixes — and each break is a
      token you paid for.
    ar: >-
      لا تكتفِ بالمتوسّط — اطبع القطع الفعلية لجملة واحدة وانظر إليها. ستجد
      الكلمات الإنجليزية تبقى سليمة، بينما العربية تتكسّر عند أداة التعريف ثم
      عند اللواصق — وكل كسرة منها رمز تدفع ثمنه.
  - en: >-
      Before blaming the algorithm, check the vocabulary budget. A tokenizer
      with 250k pieces spread over 46 languages and one with 50k pieces spent
      almost entirely on English are making different trades, and neither is a
      bug — the cost just lands on different readers.
    ar: >-
      قبل أن تلوم الخوارزمية، انظر إلى ميزانية المفردات. مُجزِّئ يملك مئتين
      وخمسين ألف قطعة يوزّعها على ستّ وأربعين لغة يختلف جذرياً عن آخر يملك
      خمسين ألف قطعة أنفقها كلّها تقريباً على الإنجليزية. لا خطأ في أيّهما —
      لكن الثمن يدفعه قرّاء مختلفون.

terms:
  tokenization:
    en: "Cutting text into the pieces a model actually reads. The model never sees characters or words — only these."
    ar: "تقطيع النص إلى الوحدات التي يتعامل معها النموذج فعلاً. النموذج لا يرى حروفاً ولا كلمات — يرى هذه القطع فقط."
  subword:
    en: "A piece smaller than a word. It lets a fixed vocabulary cover words it has never seen, at the cost of splitting them."
    ar: "قطعة أصغر من كلمة كاملة. تسمح لقاموس محدود الحجم بتغطية كلمات لم يرها من قبل، لكن على حساب تفتيتها."
  vocabulary:
    en: "The fixed set of pieces a tokenizer knows. Its size is a budget, and every language in the training mix competes for it."
    ar: "مجموعة القطع التي يعرفها المُجزِّئ، وحجمها ثابت. فكّر فيها كميزانية محدودة تتنافس عليها كل اللغات الموجودة في بيانات التدريب."
  context window:
    en: "How many tokens a model can hold at once. Measured in tokens, not words — so a language with higher fertility gets less of it."
    ar: "السعة القصوى من الرموز التي يستطيع النموذج معالجتها دفعة واحدة. تُقاس بالرموز لا بالكلمات، لذا فاللغة ذات الخصوبة الأعلى تحصل فعلياً على مساحة أقل."

body:
  - type: prose
    text:
      en: >-
        Everything a language model charges you for is counted in tokens.
        Context windows are quoted in tokens, prices are quoted per million
        tokens, and rate limits are enforced in tokens. So the question "how
        many tokens does this sentence cost?" is not a technical curiosity —
        it is the bill.
        A tokenizer decides that number, and it decides it by having been
        trained on some particular mixture of text. Whatever was common in
        that mixture became whole pieces. Whatever was rare became fragments.
      ar: >-
        كل شيء في نماذج اللغة يُحسب بالرموز: حجم نافذة السياق رموز، والتسعير
        لكل مليون رمز، وحتى حدود الاستخدام تُطبَّق بالرموز. لذلك حين تسأل
        «كم رمزاً تكلّفني هذه الجملة؟» فأنت لا تسأل سؤالاً أكاديمياً — أنت
        تقرأ الفاتورة.

        من يحدّد هذا الرقم هو <Term en="Tokenizer">المُجزِّئ</Term>، ويحدّده
        بناءً على النصوص التي تدرَّب عليها. ما تكرّر كثيراً في بيانات
        <Term en="Training">التدريب</Term> أصبح قطعة واحدة كاملة، وما كان
        نادراً تفتّت إلى شظايا.

  - type: cell
    id: setup
    ref: setup
    caption:
      en: "Preflight, then the parallel corpus — verified before anything is measured."
      ar: "تهيئة أوّلية ثم تحميل المدوّنة المتوازية — مع التحقّق منها قبل بدء أي قياس."

  - type: paperRef
    slug: bpe
    note:
      en: >-
        Byte-pair encoding was proposed to solve the opposite problem: rare
        words in machine translation, which whole-word vocabularies could not
        represent at all. Merging frequent pairs into single pieces was the
        fix. The Arabic tax is that same mechanism working exactly as designed
        — on a corpus where Arabic pairs were not frequent.
      ar: >-
        وُلد <Term en="Byte Pair Encoding">ترميز أزواج البايتات</Term> أصلاً لحلّ
        مشكلة معاكسة: كيف تمثّل كلمات نادرة في الترجمة الآلية لم تستطع قواميس
        الكلمات الكاملة تغطيتها. الفكرة بسيطة: ادمج أكثر الأزواج تكراراً حتى
        تحصل على قطع مفيدة. «الضريبة العربية» ليست سوى هذه الآلية نفسها تعمل
        كما صُمّمت تماماً — لكن على بيانات لم تكن الأزواج العربية فيها
        متكرّرة بما يكفي.

  - type: cell
    id: load-corpus
    ref: load_corpus
    captures: [pairs, ar_words, en_words]
    caption:
      en: "Word counts first. Fertility is a ratio, and the denominator has to be defined before the numerator means anything."
      ar: "نبدأ بعدّ الكلمات. الخصوبة نسبة، والمقام يجب أن يكون واضحاً قبل أن يعني البسط شيئاً."

  - type: cell
    id: tokenizers
    ref: tokenizers
    captures: [n_tokenizers]
    caption:
      en: "Three vocabularies, three different bets about which languages matter."
      ar: "ثلاث مفردات، وكل واحدة منها رهان مختلف على اللغات التي تستحقّ الاستثمار."

  - type: cell
    id: fertility
    ref: fertility
    captures: [ar_fertility, en_fertility, ratio, table]
    thumbnail: true
    caption:
      en: >-
        Read DOWN the ratio column, not across one row. The spread between the
        tokenizers is the finding — the same Arabic sentences cost one of them
        four times what they cost another.
      ar: >-
        اقرأ عمود النسبة من أعلى إلى أسفل وليس صفّاً واحداً أفقياً. النتيجة
        الحقيقية في الفرق بين المُجزِّئات: الجمل العربية نفسها تكلّف أحدها أربعة
        أضعاف ما تكلّفه آخر.

  - type: cell
    id: pieces
    ref: pieces
    caption:
      en: >-
        One sentence, cut three ways. The `�` marks a token smaller than a
        single letter — the tokenizer is not splitting words, it is splitting
        characters. It is not a broken file or a broken font: the third block
        decodes the SAME bytes into readable Arabic, which is the proof that
        the fragmentation is a choice somebody made rather than a property of
        the script.
      ar: >-
        جملة واحدة مقطّعة بثلاث طرق مختلفة. علامة `�` تعني أن الرمز أصغر من
        حرف واحد — المُجزِّئ هنا لا يقطّع كلمات بل يشطر حروفاً. وهذه ليست مشكلة
        في الملف ولا في الخط: الكتلة الثالثة تُعيد فكّ البايتات نفسها إلى عربية
        مقروءة، وهذا بالتحديد هو الدليل على أن التفتيت قرار تصميمي لا خاصية
        في الكتابة العربية.

  - type: scaleNote
    text:
      en: >-
        The free profile measures {{scale.sampleSentences}} sentence pairs,
        which is more than enough for a stable ratio. Price and context
        assumptions come from the profile too — they are inputs, not facts, so
        put your own numbers in `env.cfg` rather than trusting these.
      ar: >-
        يستخدم الملف المجاني {{scale.sampleSentences}} زوج جمل، وهو أكثر من كافٍ
        للحصول على نسبة مستقرّة. أما أرقام السعر وحجم نافذة السياق فتأتي من
        الملف أيضاً — وهي مُدخَلات يمكنك تعديلها عبر `env.cfg`، لا حقائق ثابتة.

  - type: prose
    text:
      en: >-
        Notice which tokenizer is expensive. GPT-2's vocabulary was spent
        almost entirely on English, so Arabic falls through to its byte-level
        fallback and is billed one token per byte or so. BLOOM spent 250,000
        pieces across forty-six languages, and Arabic got some of them — which
        is why the same sentences cost it barely more than English.


        Neither is a bug. They are different purchases, and the difference
        lands on different readers.
      ar: >-
        انتبه لأيّ المُجزِّئات هو المُكلِف. <Term en="Vocabulary">مفردات</Term>
        GPT-2 أُنفقت شبه كاملة على الإنجليزية، فحين يصل نصّ عربي ينزلق إلى
        آلية الاحتياط البايتية ويُحاسَب بنحو رمز لكل بايت. أما BLOOM فوزّع
        مئتين وخمسين ألف قطعة على ستّ وأربعين لغة، فحصلت العربية على حصّة
        حقيقية — ولذلك الجمل نفسها لا تكلّفه إلا أكثر بقليل من الإنجليزية.


        لا خطأ في أيّهما. هما ببساطة صفقتان مختلفتان، والثمن يدفعه
        قرّاء مختلفون.

  - type: cell
    id: the-bill
    ref: the_bill
    captures: [ar_cost_multiple, effective_context_ar, effective_context_en]
    caption:
      en: "The ratio, converted into the two things it actually costs: money and room to think."
      ar: "النسبة مترجَمة إلى أثرها العملي: كم تدفع أكثر، وكم تخسر من مساحة التفكير."

  - type: exercise
    id: reduce-the-tax
    ref: reduce_the_tax
    prompt:
      en: >-
        Find the single cheapest change that moves the number. Try stripping
        diacritics, normalizing alef and yaa variants, or removing tatweel —
        each is one line, and each changes how the vocabulary matches.


        Then ask the harder question: which of these changes is safe? Stripping
        diacritics is nearly free on modern prose and destructive on Qur'anic
        or poetic text. A tokenizer optimization that quietly corrupts your
        corpus is not an optimization. Report both the tokens saved and what
        you gave up.
      ar: >-
        ابحث عن أبسط تعديل يُحرّك الرقم. جرّب حذف التشكيل، أو توحيد أشكال
        الألف والياء، أو إزالة التطويل (الكشيدة) — كل واحد منها سطر برمجي واحد،
        وكلّها تؤثّر في طريقة مطابقة المفردات.


        ثم اسأل السؤال الأهم: أيّ هذه التعديلات آمن فعلاً؟ حذف التشكيل لا يكاد
        يُؤثّر في النثر الحديث، لكنه مدمّر في النصّ القرآني أو الشعري. تحسين
        للتجزئة يُفسد مدوّنتك بصمت ليس تحسيناً. اذكر في تقريرك الرموز التي
        وفّرتها والمعلومات التي خسرتها معاً.
    hint: 1

  - type: cell
    id: verify
    ref: verify
    captures: [fertility_ratio_final]
    caption:
      en: "Both checks: the ratio you measured, and that you measured it on more than one tokenizer."
      ar: "فحصان: النسبة التي قستَها، والتأكّد من أنك قستَها على أكثر من مُجزِّئ واحد."

  - type: cell
    id: finish
    ref: finish
