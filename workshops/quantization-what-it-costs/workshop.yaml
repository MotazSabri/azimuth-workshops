schema: workshop/v1
id: quantization-what-it-costs
constellation: systems

title:
  en: "Quantization: what int8 and int4 actually cost"
  ar: "التكميم: الثمن الحقيقي لـ int8 و int4"

concept:
  en: "Three costs, and the one you did not budget for goes backwards"
  ar: "ثلاث تكاليف، والتكلفة التي لم تتوقعها تتحرك عكس ما تظن"

scenario:
  en: >-
    Quantization is the cheapest win in deployment: store the weights in
    fewer bits, and the model fits on hardware that could not hold it before.
    The papers tell you it works. What they cannot tell you is what YOUR model
    loses, because the answer depends on the model, the data, and where in the
    network the precision was spent.


    So the interesting question is not "does int4 work" — it is which of the
    three costs actually moves. Memory falls, predictably. Quality barely
    moves at all, which is the papers working. And latency does something no
    summary prepares you for: it can get WORSE, and not even in bit order.
    Measure all three and the deployment decision stops being obvious.
  ar: >-
    <Term en="Quantization">التكميم</Term> أسهل طريقة لتقليل حجم النموذج عند
    <Term en="Deployment">النشر</Term>: تمثّل الأوزان ببتّات أقل فيصبح النموذج
    قابلاً للتشغيل على بطاقات لم تكن تتّسع له. الأوراق البحثية تثبت أن النتائج
    تصمد، لكنها لا تستطيع أن تخبرك بما يخسره نموذجك تحديداً — لأن الإجابة تعتمد
    على النموذج نفسه، وعلى البيانات، وعلى المواضع التي أُنفقت فيها الدقة العددية
    داخل الشبكة.


    السؤال الجوهري ليس «هل تعمل int4؟» بل: أيّ التكاليف الثلاث يتحرك فعلاً؟
    الذاكرة تنخفض كما تتوقع. الجودة بالكاد تتأثر، وهذا ما أثبتته الأبحاث.
    لكن <Term en="Latency">زمن الاستجابة</Term> يفعل شيئاً لا يحضّرك له أيّ
    ملخّص: قد يزداد سوءاً، وليس حتى بترتيب عدد البتّات. حين تقيس التكاليف
    الثلاث معاً، يتوقف قرار النشر عن أن يكون بديهياً.

goal:
  en: >-
    Measure perplexity, memory and latency for the same model at fp16, int8
    and int4, plot the three against each other, and identify which of the
    three costs moves first and which barely moves at all.
  ar: >-
    قِس الحيرة والذاكرة وزمن الاستجابة لنفس النموذج عند fp16 وint8 وint4، ثم
    ارسم المقاييس الثلاثة جنباً إلى جنب، وحدّد أيّها يتحرك أولاً وأيّها يكاد
    لا يتغيّر.

difficulty: intermediate
status: stable
publishedAt: "2026-08-26"

maintenance:
  # volatile: bitsandbytes and transformers both move fast, and the workshop
  # downloads a checkpoint. This is the tier that needs monthly CI and will
  # eventually need a rewrite — the first one in the corpus, deliberately,
  # to prove the pin strategy under real conditions.
  tier: volatile
  cadence: monthly

estimate:
  gpuMinutes: 12
  totalMinutes: 40

papers:
  - slug: llm-int8
    role: core
    label:
      en: "why naive int8 breaks large models, and the outlier insight that fixes it — Dettmers et al., 2022"
      ar: "لماذا ينهار int8 البسيط في النماذج الكبيرة، وكيف أنقذته القيم الشاذة — Dettmers وآخرون، 2022"
  - slug: gptq
    role: core
    label:
      en: "one-shot 4-bit quantization that survives, by minimising layer-wise error — Frantar et al., 2023"
      ar: "تكميم 4-bit بخطوة واحدة يصمد، عبر تقليل الخطأ طبقة بطبقة — Frantar وآخرون، 2023"
  - slug: qlora
    role: supporting
    label:
      en: "the same 4-bit weights, but trained through rather than only served"
      ar: "نفس الأوزان الرباعية، لكن هنا نُدرّب من خلالها لا مجرد أن نستخدمها في الاستدلال"
  - slug: deep-compression
    role: supporting
    label:
      en: "compression before transformers: pruning, quantizing and coding as one pipeline"
      ar: "ضغط النماذج قبل عصر المحوّلات: تشذيب وتكميم وترميز في خط أنابيب واحد"

assets: []

dependencies:
  pip:
    # Pinned hard. This is the volatile tier: bitsandbytes in particular has
    # broken on minor releases, and "whatever PyPI had that morning" is how a
    # workshop starts failing for readers months after it was verified.
    - "transformers==5.16.1"
    - "accelerate==1.14.0"
    - "datasets==5.0.1"
    - "bitsandbytes==0.46.1"
    - "tokenizers==0.23.1"
    - "safetensors==0.8.0"
    - "huggingface-hub==1.28.0"

profiles:
  - id: free
    default: true
    name:
      en: "Free tier (T4)"
      ar: "المستوى المجاني (T4)"
    requires:
      # A GPU is genuinely needed: bitsandbytes int8/int4 kernels are CUDA
      # only, and this is the first workshop in the corpus where the honest
      # answer to `gpu` is true.
      gpu: true
      # 6, not 14. The first version declared 14 because that is what a T4
      # has — a guess dressed as a requirement, and it refused an 8 GB card
      # that runs this workshop comfortably. The weights are under a gigabyte
      # at fp16; peak allocation including activations and the KV cache is a
      # few. The `measure` cell now PRINTS the peak so this number can be set
      # from a measurement instead of from the hardware that happened to be
      # nearby.
      vramGb: 6
      ramGb: 8
      # bitsandbytes ships no working Windows CUDA extension. Without this,
      # a Windows run fails 39 seconds in with
      # `OSError: [WinError 127] The specified procedure could not be found`
      # thrown from inside a model load — a message that names neither the
      # library nor the cause. Declaring the platform moves that to preflight,
      # where it costs a second and says "open it in Colab".
      platforms: [linux]
      # bitsandbytes ships no working CUDA extension for Windows: the model
      # load dies with "[WinError 127] The specified procedure could not be
      # found", thrown from inside a library, naming nothing a reader could
      # act on. Declaring the platform turns that into AZ-E104 at setup with
      # "open this in Colab instead".
      #
      # This is the first workshop that needs the field, and it needs it
      # because it is the first `volatile`-tier one — which is exactly the
      # kind of thing that tier was introduced to surface.
    scale:
      # Small enough to load three times on a T4 without reconnecting.
      model: "facebook/opt-350m"
      evalTokens: 40000
      latencyRuns: 20
      newTokens: 64
      seed: 17
  - id: a100
    name:
      en: "A100 / paid tier"
      ar: "A100 / المستوى المدفوع"
    requires:
      gpu: true
      vramGb: 40
      ramGb: 32
      platforms: [linux]
    scale:
      model: "facebook/opt-1.3b"
      evalTokens: 200000
      latencyRuns: 50
      newTokens: 128
      seed: 17

checks:
  - id: memory-falls
    required: true
    min: 1.5
    label:
      en: "Memory saved by int4, as a multiple of fp16"
      ar: "توفير الذاكرة في int4 مقارنة بـ fp16"
  - id: quality-survives-int8
    required: true
    max: 1.15
    min: 0.85
    label:
      en: "int8 perplexity, relative to fp16"
      ar: "حيرة int8 نسبةً إلى fp16"

hints:
  - en: >-
      Perplexity has to be measured on the SAME token windows for all three
      models or the numbers are not comparable. Fix the seed, build the windows
      once, and reuse them — a different sample per model would hide a real
      regression inside sampling noise.
    ar: >-
      لا بد أن تُقاس <Term en="Perplexity">الحيرة</Term> على نفس نوافذ الرموز
      في النماذج الثلاثة، وإلا فلن تستطيع مقارنة الأرقام. ثبّت البذرة، وأنشئ
      النوافذ مرة واحدة، ثم أعد استخدامها — لأن سحب عيّنة مختلفة لكل نموذج
      يُغرق أي تراجع حقيقي في ضجيج العيّنات.
  - en: >-
      Memory is the honest win and latency is the surprising one. Quantized
      weights are smaller, but every matmul now pays a dequantize step, so
      int4 can be SLOWER than fp16 at small batch sizes even though it uses a
      fraction of the memory. Measure it rather than assuming the direction.
    ar: >-
      الذاكرة هي المكسب الواضح، أما المفاجأة فهي
      <Term en="Latency">زمن الاستجابة</Term>. الأوزان المكمَّمة أصغر حجماً
      بالفعل، لكن كل عملية ضرب مصفوفات أصبحت تسبقها خطوة
      <Term en="Dequantization">فكّ تكميم</Term>، لذلك قد تكون int4 أبطأ من
      fp16 عند أحجام الدُّفعات الصغيرة رغم أنها تستهلك جزءاً بسيطاً من
      الذاكرة. قِسها فعلياً بدلاً من افتراض الاتجاه.
  - en: >-
      If int8 perplexity moved a lot, look at which layers you quantized. The
      LLM.int8() result is that a small number of outlier feature dimensions
      carry most of the damage, and keeping just those in fp16 recovers nearly
      all the quality. That is why the paper is a core one here.
    ar: >-
      إذا تغيّرت <Term en="Perplexity">حيرة</Term> int8 بشكل ملحوظ، راجع أيّ
      الطبقات كُمِّمت. الاكتشاف الأساسي في LLM.int8() هو أن عدداً قليلاً من
      الأبعاد ذات <Term en="Outlier">القيم الشاذة</Term> يتسبب في معظم التدهور،
      وأن الاحتفاظ بهذه الأبعاد وحدها في fp16 يستعيد الجودة بالكامل تقريباً.
      لهذا السبب تُعدّ هذه الورقة محورية في هذه الورشة.

terms:
  quantization:
    en: "Storing weights in fewer bits than they were trained in. The weights change; the architecture does not."
    ar: "تمثيل الأوزان ببتّات أقل مما دُرِّبت عليه. الأوزان تتغيّر لكن بنية الشبكة تبقى كما هي."
  perplexity:
    en: "How surprised a language model is by real text. Lower is better, and small relative changes matter more than they look."
    ar: "مقياس لمدى «استغراب» نموذج اللغة حين يرى نصاً حقيقياً. كلما انخفضت كان النموذج أفضل، والفروق النسبية الصغيرة أهم مما تبدو."
  outlier feature:
    en: "A dimension whose activations are far larger than the rest. Rare, and responsible for most of the damage naive quantization does."
    ar: "بُعد في التنشيطات قيمته أكبر بكثير من بقية الأبعاد. نادر الحدوث، لكنه المسؤول الرئيسي عن التدهور الذي يسببه التكميم البسيط."
  dequantization:
    en: "Converting stored low-bit weights back to a compute dtype before a matmul. The hidden cost that can make a smaller model slower."
    ar: "تحويل الأوزان المخزّنة ببتّات قليلة إلى صيغة حسابية كاملة قبل كل عملية ضرب مصفوفات. هذه هي التكلفة الخفية التي قد تجعل النموذج الأصغر أبطأ."

body:
  - type: prose
    text:
      en: >-
        Three numbers move when you quantize, and they do not move together.
        Memory falls roughly with the bit count, and that part is arithmetic.
        Quality falls too, but not smoothly — it barely moves for a while and
        then falls off. Latency is the one that surprises people, because it
        can go the wrong way entirely.


        Measuring all three at once is the point. A paper reporting only
        perplexity is not hiding anything; it is answering a different
        question from the one you have when you are deciding what to deploy.
      ar: >-
        حين تُكمِّم نموذجاً، تتحرك ثلاثة أرقام — لكنها لا تتحرك معاً. الذاكرة
        تنخفض بشكل يكاد يكون حسابياً مع عدد البتّات.
        <Term en="Perplexity">الحيرة</Term> تنخفض هي أيضاً لكن ليس بسلاسة: تبقى
        شبه ثابتة لفترة ثم تهوي فجأة. أما
        <Term en="Latency">زمن الاستجابة</Term> فهو المفاجأة، لأنه قد يسير في
        الاتجاه المعاكس تماماً.


        الهدف من هذه الورشة هو قياس الثلاثة معاً. الورقة البحثية التي تعرض
        الحيرة وحدها ليست تخفي شيئاً — هي ببساطة تجيب عن سؤال مختلف عن السؤال
        الذي تواجهه حين تقرّر ماذا تنشر فعلياً.

  - type: cell
    id: setup
    ref: setup
    caption:
      en: "Preflight. This is the first workshop here that genuinely needs a GPU — int8 and int4 kernels are CUDA only."
      ar: "تهيئة مبدئية. هذه أول ورشة هنا تحتاج <Term en=\"GPU\">معالج رسوميات</Term> فعلاً — نوى int8 وint4 تعمل على CUDA حصراً."

  - type: cell
    id: windows
    ref: windows
    captures: [n_windows]
    caption:
      en: >-
        Build the evaluation windows ONCE, before any model loads. Every
        variant is scored on identical text — a different sample per model
        would hide a real regression inside sampling noise.
      ar: >-
        أنشئ نوافذ التقييم مرة واحدة قبل تحميل أيّ نموذج. جميع الصيغ تُقيَّم
        على النص نفسه — لأن سحب عيّنة مختلفة لكل نموذج يدفن أيّ تراجع حقيقي
        تحت ضجيج العيّنات.

  - type: paperRef
    slug: llm-int8
    note:
      en: >-
        Dettmers and colleagues found that naive int8 collapses on large models
        not because 8 bits is too few on average, but because a handful of
        outlier feature dimensions have a range the rest do not. Keeping those
        in higher precision is the whole fix, and it is why int8 below is
        nearly free while a naive implementation would not be.
      ar: >-
        اكتشف Dettmers وفريقه أن <Term en="Quantization">التكميم</Term> إلى int8
        بالطريقة المباشرة ينهار في النماذج الكبيرة — ليس لأن 8 بتّات قليلة في
        المتوسط، بل لأن عدداً صغيراً من أبعاد التنشيطات
        <Term en="Outlier">الشاذة</Term> يملك مدى أكبر بكثير من البقية. الحل
        بأكمله هو الاحتفاظ بهذه الأبعاد فقط في دقة أعلى. لهذا السبب ستجد أن
        int8 في هذه الورشة شبه مجاني من ناحية الجودة، بينما التنفيذ البسيط لن
        يعطيك النتيجة نفسها.

  - type: cell
    id: measure
    ref: measure
    captures: [fp16_ppl, int8_ppl, int4_ppl, fp16_mb, int8_mb, int4_mb, peak_gb]
    caption:
      en: "Three loads, three measurements each. The model is freed between variants so the memory figure is the model, not the leftovers."
      ar: "نحمّل النموذج ثلاث مرات ونقيس ثلاثة مقاييس في كل مرة. نحرّر الذاكرة بين الصيغ حتى يعكس رقم الذاكرة النموذج نفسه لا بقايا التحميل السابق."

  - type: scaleNote
    text:
      en: >-
        The free profile uses {{scale.model}} and {{scale.evalTokens}} tokens
        of evaluation text — small enough to load three times on a T4 without
        reconnecting. The shape of the curve is what transfers to a larger
        model, not the absolute perplexity.
      ar: >-
        يستخدم الملف المجاني نموذج {{scale.model}} مع {{scale.evalTokens}} رمزاً
        للتقييم — حجم صغير بما يكفي لتحميل النموذج ثلاث مرات على T4 دون أن
        ينقطع الاتصال. ما يهمّك هنا هو شكل المنحنى وليس القيمة المطلقة
        للحيرة — الشكل ينتقل إلى نموذج أكبر.

  - type: cell
    id: curve
    ref: curve
    captures: [memory_ratio, ppl_ratio_int8, ppl_ratio_int4]
    thumbnail: true
    caption:
      en: >-
        Three costs on one figure, all zero-based so a flat line looks flat.
        Two of these fall the way you expect. The third is the workshop.
      ar: >-
        التكاليف الثلاث في رسم واحد، والمحاور تبدأ من الصفر حتى لا يبدو خط
        مستوٍ منحدراً. اثنتان تنخفضان كما تتوقع — الثالثة هي سبب وجود هذه
        الورشة.

  - type: cell
    id: latency
    ref: latency
    captures: [fp16_ms, int8_ms, int4_ms]
    caption:
      en: >-
        The one that goes the wrong way — and check the ORDER, not just the
        direction. If a variant with more bits is faster than one with fewer,
        the cost is not the bits, it is what the kernel has to do around them.
      ar: >-
        هذا هو الرقم الذي يسير عكس التوقع — ولاحظ الترتيب وليس الاتجاه فقط. إذا
        كانت صيغة ببتّات أكثر أسرع من صيغة ببتّات أقل، فالتكلفة ليست في عدد
        البتّات بل فيما تفعله النواة الحسابية حولها.

  - type: exercise
    id: pick-a-deployment
    ref: pick_a_deployment
    prompt:
      en: >-
        Choose a variant for a stated deployment, and defend it with your own
        numbers rather than the defaults. Write down the constraint first —
        "fits in 8 GB", "under 50 ms per token", "quality within 2% of fp16" —
        then read the table and pick.


        Then notice what the exercise did to you. Given one number you optimise
        it; given three you have to state a constraint, and the constraint is
        a product decision, not a technical one. Which of the three would you
        never trade, and would your answer change for a chatbot versus a batch
        summarizer?
      ar: >-
        اختر صيغة لسيناريو نشر محدّد، وبرّر اختيارك بالأرقام التي قِستها أنت لا
        بالقيم الافتراضية. حدّد القيد أولاً — مثلاً «يجب أن يعمل ضمن 8 غيغابايت»
        أو «أقل من 50 مللي ثانية للرمز الواحد» أو «جودة لا تقلّ عن 98٪ من fp16»
        — ثم اقرأ الجدول واختر.


        بعدها توقّف ولاحظ ما فعله التمرين. حين يكون أمامك رقم واحد تحاول
        تحسينه. حين يكون أمامك ثلاثة أرقام، تُضطر لتحديد قيد — والقيد قرار
        منتَج لا قرار تقني. أيّ التكاليف الثلاث لن تتنازل عنها أبداً؟ وهل
        ستتغيّر إجابتك إذا كان التطبيق روبوت محادثة بدلاً من ملخِّص دُفعات؟
    hint: 2

  - type: cell
    id: verify
    ref: verify
    caption:
      en: "Memory must actually fall, and int8 must actually survive. If int8 moved a lot, hint 3 is the reason."
      ar: "الذاكرة يجب أن تنخفض فعلاً، وint8 يجب أن تصمد جودتها. إذا تحرّكت حيرة int8 بشكل ملحوظ، ارجع إلى التلميح الثالث."

  - type: cell
    id: finish
    ref: finish
